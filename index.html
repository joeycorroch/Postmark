<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Postmark</title>
<meta name="description" content="Stamp the world, one city at a time.">
<meta name="theme-color" content="#1B1F4B">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{margin:0;height:100%}*,*::before,*::after{box-sizing:border-box}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,900&display=swap">
<style>
/* Layout: a 390×844 phone canvas, built 1:1 from the Wonder artboards, scaled to fit the viewer. One postcard palette only. */
:root{
  --paper-cream:#F6EBD3; --paper-card:#FFF8E7; --ink-navy:#1F2A44; --ink-soft:#4A4F63;
  --stamp-red:#B83A2B; --stamp-gold:#9A6F0E; --stamp-gold-wash:#F7E6B5;
  --city-lisbon:#E3A72F; --city-kyoto:#C4473A; --city-capetown:#2A7C86; --accent-plum:#7A4A7D;
  --map-ocean:#BFD9D6; --map-land:#F0DFB8; --map-land-edge:#C9B07A;
  --surround:#E4D6B6; --frame:#1F2A44;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .25  0 0 0 0 .14  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23g)' opacity='.32'/></svg>");
  color-scheme:light;
}
/* Bright: the same postcard system, turned up — sunnier paper, sky ocean, candy accents. Classic stays one tap away. */
html.bright{
  --paper-cream:#FFF3D6; --paper-card:#FFFCF2; --ink-navy:#1B1F4B; --ink-soft:#50557F;
  --stamp-red:#E8382A; --stamp-gold:#AD7400; --stamp-gold-wash:#FFE38A;
  --city-lisbon:#FFC21F; --city-kyoto:#FF4F6E; --city-capetown:#009C94; --accent-plum:#9D4EFF;
  --map-ocean:#6FD3F0; --map-land:#FFE7A3; --map-land-edge:#E8A93A;
  --surround:#FFD9A0; --frame:#1B1F4B;
}
html.bright .btn.navy{box-shadow:4px 4px 0 var(--city-kyoto)}
html.bright .bub.hot{background:var(--city-kyoto)}
html.bright .regions h2,html.bright .phead h1{color:var(--ink-navy)}
html,body{height:100%}
body{margin:0;background:var(--surround);color:var(--ink-navy);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:relative;height:100%;box-sizing:border-box;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#phone{position:absolute;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;background:var(--map-ocean);overflow:hidden;border-radius:44px;box-shadow:0 0 0 10px var(--frame),0 30px 60px -20px rgba(31,42,68,.45)}
#phone.bare{border-radius:20px;box-shadow:0 0 0 2px var(--frame)}
#phone *{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--stamp-red);outline-offset:2px}
.disp{font-family:var(--font-display);font-weight:900}
.ic{display:block;flex-shrink:0}

/* status bar + nav (shared) */
#status{position:absolute;top:0;left:0;right:0;height:54px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;z-index:50;pointer-events:none}
#status span{font-size:17px;font-weight:600}
#status div{display:flex;align-items:center;gap:6px}
#nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--paper-card);border-top:2px solid var(--ink-navy);display:flex;justify-content:space-around;align-items:center;padding:0 24px;z-index:12}
#nav button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-soft);font-size:12px;font-weight:500;min-width:64px}
#nav button.on{color:var(--stamp-red);font-weight:700}

/* map art levels */
.art{position:absolute;left:0;top:0;width:390px;height:844px;opacity:0;pointer-events:none;transition:transform .6s cubic-bezier(.3,.7,.2,1),opacity .45s ease}
.art.on{opacity:1;pointer-events:auto}
.art svg.map{position:absolute;inset:0;width:390px;height:844px}
.land path{fill:var(--map-land);stroke:var(--map-land-edge);stroke-linejoin:round}
.sea path{fill:var(--map-ocean);stroke:var(--map-land-edge);stroke-linejoin:round}
.hl path{fill:var(--stamp-gold-wash);stroke:var(--stamp-gold);stroke-width:3;stroke-linejoin:round}
.mk{position:absolute}
.art.on .mk{animation:grow .45s .15s both cubic-bezier(.3,1.4,.5,1)}
@keyframes grow{from{transform:scale(.85);opacity:.4}to{transform:none;opacity:1}}

.bub{position:absolute;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink-navy);background:var(--paper-card);color:var(--ink-navy);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.bub.hot{background:var(--stamp-red);color:var(--paper-card)}
.cst{position:absolute;width:36px;height:36px;padding:0}
.cst .fl{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:2px dashed var(--ink-soft);background:var(--paper-card)}
.cst .fl svg{display:block;width:100%;height:100%;filter:saturate(.6);opacity:.8}
.cst.got .fl,.cst.gold .fl{border:3px solid var(--stamp-red)}.cst.gold .fl{border-color:var(--stamp-gold)}
.cst.got .fl svg,.cst.gold .fl svg{filter:none;opacity:1}
.cst .badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-navy);background:var(--stamp-red);color:var(--paper-card);display:flex;align-items:center;justify-content:center}
.cst.gold .badge{background:var(--stamp-gold)}
.cst.open{cursor:pointer}
.miniflag{display:inline-block;width:22px;height:22px;border-radius:50%;overflow:hidden;border:2px solid var(--ink-navy);vertical-align:-3px;margin-right:8px;flex-shrink:0}
.miniflag svg{display:block;width:100%;height:100%}
.banner .ct{display:flex;align-items:center}.banner .ct .miniflag{width:18px;height:18px;margin-right:6px;border-width:1.5px}
/* hint: the hand points the way */
.hint{position:absolute;inset:0;pointer-events:none;z-index:7}
.ui.on > .hint{pointer-events:none}
.hint .pt{position:absolute;width:170px;height:142px;animation:slidein .6s .5s both cubic-bezier(.3,1.3,.5,1)}
.hint .pt svg{width:100%;height:100%;animation:jab .9s 1.2s infinite ease-in-out}
@keyframes slidein{from{transform:translateX(220px)}to{transform:none}}
@keyframes jab{50%{transform:translateX(-7px)}}
.bubble{position:absolute;background:var(--paper-card);border:2px solid var(--ink-navy);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;box-shadow:3px 3px 0 var(--ink-navy);animation:pop .4s 1s both cubic-bezier(.3,1.5,.5,1);white-space:nowrap}
.bubble::after{content:"";position:absolute;bottom:-9px;right:96px;width:14px;height:14px;background:var(--paper-card);border-right:2px solid var(--ink-navy);border-bottom:2px solid var(--ink-navy);transform:rotate(45deg)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
/* empty passport */
.empty{margin:4px 20px 0;background:var(--paper-card);background-image:var(--grain);border:2px dashed var(--ink-soft);border-radius:16px;padding:22px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.empty .wv{width:150px;height:180px;margin:-6px 0 0;border-bottom:2px solid var(--ink-navy)}
.empty .wv svg{width:100%;height:100%;overflow:hidden}
.empty .wv .arm{transform-origin:108px 170px;animation:wave 1.3s .3s ease-in-out 3}
@keyframes wave{25%{transform:rotate(-12deg)}75%{transform:rotate(10deg)}}
.empty b{font:900 22px/1.15 var(--font-display)}
.empty p{margin:0;font-size:14px;line-height:1.45;color:var(--ink-soft);max-width:260px}
.empty .btn{width:100%;margin-top:6px}
.tile.re{cursor:pointer}.tile.again{animation:again .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes again{from{transform:scale(.9)}to{transform:none}}
.impact{position:absolute;width:120px;height:80px;pointer-events:none;overflow:visible}
.impact line{stroke:var(--ink-navy);stroke-width:3.5;stroke-linecap:round}
.thumbs{position:absolute;width:150px;height:165px;pointer-events:none}
.thumbs svg{width:100%;height:100%;overflow:visible}
.pin{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.pin .disc{width:60px;height:60px;border-radius:50%;border:3px solid var(--ink-navy);display:flex;align-items:center;justify-content:center}
.pin.todo .disc{background:var(--paper-card)!important;border-style:dashed}
.pin .lbl{background:var(--paper-card);border:2px solid var(--ink-navy);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.pin .tick{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--stamp-red);border:2px solid var(--ink-navy);color:var(--paper-card);display:flex;align-items:center;justify-content:center}
.pin:active .disc{transform:scale(.94)}
.citydot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--ink-navy);border:2px solid var(--paper-card);transform:translate(-50%,-50%)}

/* per-level UI (top row + bottom card) */
.ui{position:absolute;inset:0;padding-top:54px;padding-bottom:84px;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5}
.ui.on{opacity:1}
.ui.on > *{pointer-events:auto}
.toprow{display:flex;align-items:center;gap:10px;margin:8px 20px 0}
.chip{height:44px;padding:0 14px;display:flex;align-items:center;gap:4px;background:var(--paper-card);border:2px solid var(--ink-navy);border-radius:999px;font-size:14px;font-weight:700}
.search{flex:1;height:48px;padding:0 16px;display:flex;align-items:center;gap:10px;background:var(--paper-card);border:2px solid var(--ink-navy);border-radius:999px;color:var(--ink-soft);font-size:15px}
.toprow .search{height:44px;gap:8px;font-size:14px}
.regions{margin-top:auto;background:var(--paper-card);border-top:2px solid var(--ink-navy);border-radius:20px 20px 0 0;padding:16px 20px 8px;display:flex;flex-direction:column;gap:6px}
.regions h2{margin:0;font:900 22px/1.2 var(--font-display)}
.rrow{height:44px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--map-land-edge);font-size:16px;font-weight:700;text-align:left;width:100%}
.rrow:last-child{border-bottom:0}
.rrow span{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:13px;font-weight:400}
.rrow.off{color:var(--ink-soft)}
.bcard{margin:auto 20px 16px;background:var(--paper-card);border:2px solid var(--ink-navy);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bcard .hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bcard .hd b{font:900 22px/1.2 var(--font-display)}
.bcard .hd span,.bcard p{font-size:13px;color:var(--ink-soft);margin:0}
.bar{height:10px;border-radius:999px;background:var(--paper-cream);border:2px solid var(--ink-navy);overflow:hidden}
.bar i{display:block;height:100%;background:var(--stamp-red);transition:width .7s cubic-bezier(.3,.7,.2,1)}
.bar.gold{border-color:var(--stamp-gold);background:var(--paper-card)}
.bar.gold i{background:var(--stamp-gold)}
.goldline{display:flex;align-items:center;gap:8px;color:var(--stamp-gold);font-size:13px;font-weight:700}

/* passport */
#passport{position:absolute;inset:0;background:var(--paper-cream);z-index:8}
#pscroll{position:absolute;top:54px;bottom:84px;left:0;right:0;overflow-y:auto;display:flex;flex-direction:column}
.phead{padding:8px 20px 16px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp-red)}
.phead h1{margin:0;font:900 36px/1.05 var(--font-display);letter-spacing:-.01em}
.phead p{margin:0;font-size:15px;color:var(--ink-soft)}
.pcards{display:flex;flex-direction:column;gap:16px;padding-bottom:24px}
.pcard{margin:0 20px;background:var(--paper-card);border:2px solid var(--ink-navy);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.pcard.gold{background:var(--stamp-gold-wash);border:3px solid var(--stamp-gold)}
.prow{display:flex;align-items:center;gap:16px}
.ring{flex-shrink:0;width:116px;height:116px;border-radius:50%;border:5px solid var(--stamp-red);display:flex;align-items:center;justify-content:center;transform:rotate(-10deg)}
.ring>div{width:92px;height:92px;border-radius:50%;border:2px dashed var(--stamp-red);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--stamp-red);font-size:10px;font-weight:700;letter-spacing:.12em}
.ring b{font:900 12px/1 var(--font-display);letter-spacing:0}
.gold .ring{border-color:var(--stamp-gold)}.gold .ring>div{border-color:var(--stamp-gold);color:var(--stamp-gold)}
.pinfo{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.pinfo b{font:900 24px/1.05 var(--font-display)}
.pinfo span{font-size:13px;color:var(--ink-soft)}
.gold .pinfo span{color:var(--stamp-gold);font-weight:700}
.tiles{display:flex;gap:10px}
.tile{width:76px;height:92px;background:var(--paper-cream);border:2px dashed var(--ink-navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile .sq{width:52px;height:46px;border:2px solid var(--ink-navy);display:flex;align-items:center;justify-content:center}
.tile b{font:900 13px/1.1 var(--font-display)}
.tile.lock{background:none;border-color:var(--ink-soft);color:var(--ink-soft)}
.tile.lock b{font:500 12px/1.1 var(--font-body)}
.gold .tile{background:var(--paper-card);border-color:var(--stamp-gold)}
.demo{margin:auto 20px 0;padding:14px 0 4px;border-top:1px solid var(--map-land-edge);display:flex;flex-direction:column;gap:8px}
.demo small{font-size:12px;color:var(--ink-soft)}
.demo button{height:38px;border:2px solid var(--ink-soft);border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-soft)}

/* city card sheet */
#sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;padding-top:54px;background:rgba(31,42,68,.45);opacity:0;pointer-events:none;transition:opacity .3s}
#sheet.on{opacity:1;pointer-events:auto}
#sheetScroll{flex:1;overflow-y:auto;padding:0 15px 24px;transform:translateY(40px);transition:transform .38s cubic-bezier(.3,.7,.2,1)}
#sheet.on #sheetScroll{transform:none}
.closerow{display:flex;justify-content:flex-end;padding:6px 0 10px}
.xbtn{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink-navy);background:var(--paper-card);display:flex;align-items:center;justify-content:center}
.ccard{width:360px;background:var(--paper-card);border:2px solid var(--ink-navy);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px}
.banner{position:relative;height:184px;border:2px solid var(--ink-navy);border-radius:8px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.banner .stp{position:absolute;top:14px;right:14px;width:104px;height:128px;background:var(--paper-cream);border:2px dashed var(--ink-navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transform:rotate(4deg);color:var(--ink-navy)}
.banner .stp .in{width:80px;height:84px;background:var(--ink-navy);display:flex;align-items:center;justify-content:center}
.banner .stp b{font:900 12px/1.1 var(--font-display);text-align:center;padding:0 4px}
.banner .post{position:absolute;top:10px;left:14px;width:64px;height:64px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);font-size:11px;font-weight:700;letter-spacing:.12em;text-align:center;line-height:1.1}
.banner .gf{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.banner h2{margin:0;font:900 44px/1.05 var(--font-display);letter-spacing:-.02em}
.banner .ct{font-size:13px;font-weight:700}
.vmark{position:absolute;bottom:14px;right:14px;padding:6px 10px;background:var(--paper-card);border:3px solid var(--stamp-red);color:var(--stamp-red);border-radius:6px;display:flex;flex-direction:column;align-items:center;transform:rotate(-8deg)}
.vmark b{font-size:14px;font-weight:700;letter-spacing:.14em}
.vmark span{font-size:11px;font-weight:700;letter-spacing:.08em}
.vmark.press{animation:press .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes press{from{transform:rotate(-8deg) scale(1.12);opacity:.5}to{transform:rotate(-8deg) scale(1);opacity:1}}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px;border:2px solid var(--ink-navy)}
.blurb{margin:0;font-size:16px;line-height:1.55;color:var(--ink-soft)}
.facts{display:flex;flex-direction:column;gap:10px}
.fact{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;margin:0}
.fact svg{margin-top:2px;color:var(--stamp-red)}
.kpanel{background:var(--stamp-gold-wash);border:2px solid var(--stamp-gold);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.kpanel .hd{display:flex;justify-content:space-between;align-items:center}
.kpanel .hd b{font:900 17px/1.2 var(--font-display)}
.kpanel .hd span{font-size:13px;font-weight:700;color:var(--stamp-gold)}
.ktiles{display:flex;gap:10px}
.kt{width:72px;height:88px;background:var(--paper-card);border:2px dashed var(--stamp-gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.kt .sq{width:48px;height:44px;border:2px solid var(--ink-navy);display:flex;align-items:center;justify-content:center}
.kt b{font:900 12px/1.1 var(--font-display)}
.kt.todo{background:none;border-color:var(--ink-soft);color:var(--ink-soft)}
.kt.todo .sq{border:2px dashed var(--ink-soft)}
.kpanel .bar{border-color:var(--stamp-gold);background:var(--paper-card)}
.kpanel .bar i{background:var(--stamp-gold)}
.acts{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.btn{height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700}
.btn.navy{background:var(--ink-navy);color:var(--paper-cream)}
.btn.line{border:2px solid var(--stamp-red);color:var(--stamp-red)}
.btn.red{background:var(--stamp-red);color:var(--paper-card)}
.btn.big{height:52px;border-radius:12px;font-size:16px}
.undo{align-self:center;font-size:13px;font-weight:500;color:var(--ink-soft);text-decoration:underline}

/* stamp moments */
#moment{position:absolute;inset:0;z-index:30;display:none}
#moment.on{display:block}
.full{position:absolute;inset:0;background:var(--paper-cream);display:flex;flex-direction:column;overflow:hidden}
.full.goldbg{background:var(--stamp-gold-wash)}
.mhead{position:relative;padding:62px 20px 0;display:flex;justify-content:space-between;align-items:flex-start}
.mhead h1{margin:4px 0 0;font:900 34px/1.05 var(--font-display);letter-spacing:-.01em}
.page{position:relative;margin:24px 24px 0;height:400px;background:var(--paper-card);border:2px solid var(--ink-navy);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.goldbg .page{border:3px solid var(--stamp-gold)}
.bigring{width:236px;height:236px;border-radius:50%;border:6px solid var(--stamp-red);display:flex;align-items:center;justify-content:center;transform:rotate(-10deg)}
.bigring>div{width:204px;height:204px;border-radius:50%;border:2px dashed var(--stamp-red);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--stamp-red);font-size:12px;font-weight:700;letter-spacing:.14em}
.bigring b{font:900 27px/1 var(--font-display);letter-spacing:-.01em}
.bigring hr{width:120px;height:2px;border:0;background:currentColor;margin:0}
.goldbg .bigring{border-color:var(--stamp-gold)}.goldbg .bigring>div{border-color:var(--stamp-gold);color:var(--stamp-gold)}
.cornerst{position:absolute;bottom:16px;right:16px;width:84px;height:100px;background:var(--paper-cream);border:2px dashed var(--ink-navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transform:rotate(6deg)}
.cornerst .sq{width:60px;height:56px;border:2px solid var(--ink-navy);display:flex;align-items:center;justify-content:center}
.cornerst b{font:900 13px/1 var(--font-display)}

/* ---------- depth: paper grain, offset shadows, ink ---------- */
.ccard,#passport,.full,.pcard,.page,.citymoment,.bcard,.regions,#nav,.kpanel{background-image:var(--grain)}
.art::after{content:"";position:absolute;inset:0;background-image:var(--grain);mix-blend-mode:multiply;opacity:.7;pointer-events:none}
.bcard{box-shadow:4px 4px 0 var(--ink-navy)}
.chip,.search{box-shadow:3px 3px 0 var(--ink-navy)}
.chip{transition:transform .08s,box-shadow .08s}.chip:active{transform:translate(3px,3px);box-shadow:none}
.bub{box-shadow:2px 2px 0 var(--ink-navy)}

.pin .disc{position:relative;box-shadow:3px 3px 0 var(--ink-navy)}

.ccard{box-shadow:6px 6px 0 var(--ink-navy)}
.banner{box-shadow:inset 0 -5px 0 rgba(31,42,68,.14)}

.xbtn{box-shadow:3px 3px 0 var(--ink-navy)}
.pcard{box-shadow:5px 5px 0 var(--ink-navy)}.pcard.gold{box-shadow:5px 5px 0 var(--stamp-gold)}
.page{box-shadow:6px 6px 0 var(--ink-navy)}.goldbg .page{box-shadow:6px 6px 0 var(--stamp-gold)}
.cmtile,.cornerst{box-shadow:3px 3px 0 rgba(31,42,68,.25)}
.ink{filter:url(#ink)}
.ring.ink,.bigring.ink{mix-blend-mode:multiply}
#phone *{scrollbar-width:none}#phone *::-webkit-scrollbar{display:none}
#sheetScroll{overflow-x:hidden}
/* pins drop onto the map */
.art.on .pin{animation:pindrop .6s calc(.12s + var(--i,0) * .09s) both cubic-bezier(.3,1.5,.55,1)}

.pin.fresh .disc::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--stamp-red);animation:ring .7s .75s both ease-out}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
/* the stamping hand */
#handLayer{position:absolute;inset:0;z-index:55;pointer-events:none;overflow:hidden}
.handwrap{position:absolute;width:320px;height:300px;transform-origin:130px 210px}

.handwrap svg{overflow:visible}
.handwrap .squint,.handwrap .grin{opacity:0}.handwrap.squish .eyes{opacity:0}.handwrap.squish .squint{opacity:1}
.handwrap .eyes{transition:transform .18s ease-out}.handwrap.lookup .eyes{transform:translate(1px,-4px)}
.handwrap.happy .smile{opacity:0}.handwrap.happy .grin{opacity:1}.handwrap.happy .eyes{transform:translate(0,-1px)}

.await{opacity:0}

.o-chef .sl-a{fill:#E4DFD3}.o-chef .sl-b{fill:#FFFFFF}.o-chef .sl-c{fill:#FF4F6E}.o-chef .sl-d{fill:#1B1F4B}

/* ---------- hand moods ---------- */

/* ---------- passport covers + wardrobe ---------- */
.phead{transition:background .3s}
.cover-sunset .phead{margin:0 0 6px;padding:18px 20px 22px;background:radial-gradient(circle at 82% 120%,#FFE38A 0 18%,transparent 18.5%),repeating-radial-gradient(circle at 82% 120%,transparent 0 26px,rgba(255,255,255,.14) 26px 40px),linear-gradient(165deg,#FF8A3D 0%,#FF4F8B 55%,#8B5CFF 100%);color:#fff;border-bottom:3px solid var(--ink-navy)}
.cover-sunset .phead h1,.cover-sunset .phead p{color:#fff}.cover-sunset .phead .eyebrow{color:#FFE38A}
.cover-sunset .sndbtn{top:16px}
.wardrobe{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 8px;margin:0 -4px}
.ward{flex-shrink:0;width:104px;padding:8px 6px 10px;border:2px solid var(--ink-navy);border-radius:14px;background:var(--paper-card);display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:3px 3px 0 var(--ink-navy);text-align:center}

.ward b{font:900 13px/1.1 var(--font-display)}
.ward small{font-size:10px;line-height:1.25;color:var(--ink-soft)}
.ward .prev{width:86px;height:80px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ward .prev svg{overflow:visible}
.covsw{width:86px;height:80px;border-radius:8px;border:2px solid var(--ink-navy)}
.covsw.classic{background:var(--paper-cream)}
.covsw.sunset{background:radial-gradient(circle at 80% 120%,#FFE38A 0 22%,transparent 23%),linear-gradient(165deg,#FF8A3D,#FF4F8B 55%,#8B5CFF)}
.reward{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:2px dashed var(--stamp-gold);border-radius:12px;background:var(--stamp-gold-wash);text-align:left;font-size:13px;margin-bottom:4px}
.reward b{display:block;font:900 15px/1.2 var(--font-display)}
.reward .prev{width:58px;height:54px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.reward .prev svg{overflow:visible}

/* ---------- passport data page ---------- */
.bio{position:relative;margin:0 20px 20px;padding:12px 14px 12px;border:2px solid var(--ink-navy);border-radius:16px;box-shadow:5px 5px 0 var(--ink-navy);overflow:hidden;
  background-color:var(--paper-card);background-image:repeating-radial-gradient(circle at 100% 0,rgba(157,78,255,.08) 0 1.5px,transparent 1.5px 8px),repeating-radial-gradient(circle at 0 100%,rgba(0,156,148,.08) 0 1.5px,transparent 1.5px 8px)}
.biohd{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--stamp-red);padding-bottom:8px;margin-bottom:10px;border-bottom:1.5px dashed var(--map-land-edge)}
.biohd span:last-child{color:var(--ink-soft);font-weight:500;letter-spacing:.08em}
.biorow{display:flex;gap:12px;align-items:flex-start}

.photo .pen{position:absolute;left:6px;bottom:6px;width:28px;height:28px;border-radius:50%;background:var(--ink-navy);color:var(--paper-card);display:flex;align-items:center;justify-content:center;border:2px solid var(--paper-card)}
.photo .tapme{position:absolute;left:0;right:0;top:0;padding:4px;background:var(--city-kyoto);color:#fff;font-size:10px;font-weight:700;text-align:center;letter-spacing:.04em}
.bio dl{flex:1;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;min-width:0}
.bio dl>div{min-width:0}.bio dl>.w{grid-column:span 2}
.bio dt{font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}

.sigrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
.sig{font-family:"Brush Script MT","Segoe Script","Snell Roundhand","Apple Chancery",cursive;font-size:26px;line-height:1;color:var(--ink-navy);border-bottom:1.5px solid var(--ink-soft);padding:0 6px 2px;min-width:150px;transform:rotate(-2deg)}
.sigrow small{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.mrz{margin-top:10px;padding:7px 8px;border-radius:6px;background:rgba(27,31,75,.06);font:600 9.6px/1.45 "OCR B","OCR-B","Courier New",monospace;letter-spacing:.015em;white-space:pre;overflow:hidden;color:var(--ink-navy)}
.photo.stamped::after{content:"";position:absolute;right:6px;top:6px;width:40px;height:40px;border-radius:50%;border:2.5px solid var(--stamp-red);opacity:.75;transform:rotate(-14deg);animation:press .45s both;mix-blend-mode:multiply}
/* ---------- avatar maker ---------- */
#avEd{position:absolute;inset:0;z-index:40;background:var(--paper-cream);background-image:var(--grain);display:none;flex-direction:column}

.avpane{flex:1;overflow-y:auto;padding:12px 20px 16px;display:flex;flex-direction:column;gap:14px}

/* ---------- opening screen ---------- */
#splash{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 36%,#FFF6C9 0,rgba(255,246,201,0) 42%),linear-gradient(170deg,#6FD3F0 0%,#9FE3F5 38%,#FFE38A 72%,#FFB86B 100%)}

.sun-rays{position:absolute;left:50%;top:36%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,255,255,.22) 0 8deg,transparent 8deg 20deg);border-radius:50%;animation:spin 40s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 62%);mask:radial-gradient(circle,#000 20%,transparent 62%)}

.spk2{position:absolute;color:#fff;animation:twinkle 1.8s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,255,255,.9))}

.brand{position:relative;margin:26px 0 0;font:900 58px/1 var(--font-display);letter-spacing:-.03em;color:var(--ink-navy);text-shadow:3px 3px 0 #fff,0 0 24px rgba(255,255,255,.8);animation:rise .5s 2s both}

.cst.gold .fl{animation:gglow 2.4s ease-in-out infinite}

.bbadge svg{filter:drop-shadow(0 0 12px rgba(255,194,31,.8))}
.mailbtn.new{box-shadow:3px 3px 0 var(--ink-navy),0 0 14px 4px rgba(255,79,110,.55)}
.photo.f-gold{border:3px solid #FFC21F;box-shadow:0 0 0 2px var(--ink-navy),0 0 16px 4px rgba(255,194,31,.85)}

.avframe.f-gold{border-color:#FFC21F;box-shadow:5px 5px 0 var(--ink-navy),0 0 18px 6px rgba(255,194,31,.85)}
@keyframes holo{0%{box-shadow:0 0 0 3px #FF4F8B,0 0 18px 6px rgba(255,79,139,.8)}25%{box-shadow:0 0 0 3px #9D4EFF,0 0 18px 6px rgba(157,78,255,.8)}50%{box-shadow:0 0 0 3px #2EC4C9,0 0 18px 6px rgba(46,196,201,.8)}75%{box-shadow:0 0 0 3px #FFC21F,0 0 18px 6px rgba(255,194,31,.8)}100%{box-shadow:0 0 0 3px #FF4F8B,0 0 18px 6px rgba(255,79,139,.8)}}
svg .spk{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}

.th button.lock svg{filter:grayscale(1) opacity(.35)}
.th button .lk2{position:absolute;top:18px;left:50%;margin-left:-13px;width:26px;height:26px;border-radius:50%;background:var(--ink-navy);color:#fff;display:flex;align-items:center;justify-content:center}
.th button{position:relative}

@keyframes newglow{50%{box-shadow:2px 2px 0 var(--ink-navy),0 0 16px 5px rgba(255,79,110,.6)}}

  box-shadow:0 0 0 3px var(--ink-navy),0 0 26px 8px rgba(157,78,255,.6)}

/* ---------- trips ---------- */
#trips{position:absolute;inset:0;background:var(--paper-cream);background-image:var(--grain);z-index:8}
#tscroll{position:absolute;top:54px;bottom:84px;left:0;right:0;overflow-y:auto;padding-bottom:28px}

.thead{padding:8px 20px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

.tcount b{font:900 24px/1 var(--font-display);text-shadow:none;color:var(--ink-navy)}
.tcount span{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:1}
.tbody{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.tstops{display:flex;gap:8px;flex-wrap:wrap}
.tstop{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border:2px solid var(--ink-navy);border-radius:999px;font-size:12px;font-weight:700;background:var(--paper-card)}
.tstop .sq{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-navy);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tstop.done{background:var(--stamp-gold-wash)}
.tmeta{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink-soft)}
.tform{margin:0 20px 18px;padding:14px;border:2px solid var(--ink-navy);border-radius:16px;background:var(--paper-card);box-shadow:4px 4px 0 var(--ink-navy);display:flex;flex-direction:column;gap:10px;animation:pop .3s both}
.tform h3{margin:0;font:900 20px/1.1 var(--font-display)}
.tcolors{display:flex;gap:8px}
.tcolors button{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink-navy)}
.tcolors button.on{outline:3px solid var(--ink-navy);outline-offset:2px}
.trow2{display:flex;gap:10px}.trow2 .btn{flex:1}
.thero{position:relative;margin:4px 20px 18px;padding:16px;border:2px solid var(--ink-navy);border-radius:20px;color:#fff;box-shadow:5px 5px 0 var(--ink-navy);overflow:hidden;background-image:var(--grain)}
.thero .face{position:absolute;right:14px;top:14px;width:64px;height:64px;border-radius:50%;overflow:hidden;border:3px solid #fff;background:#fff;box-shadow:0 0 18px 6px rgba(255,255,255,.55)}
.thero small{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.95}
.thero h2{margin:4px 90px 2px 0;font:900 30px/1.05 var(--font-display);text-shadow:2px 2px 0 rgba(27,31,75,.35)}
.thero p{margin:0;font-size:13px;font-weight:700}
.thero .big{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.thero .big b{font:900 54px/1 var(--font-display);text-shadow:3px 3px 0 rgba(27,31,75,.35)}
.thero .bar{margin-top:10px;border-color:#fff;background:rgba(255,255,255,.3)}
.thero .bar i{background:#fff}
.tsec{margin:0 20px 18px}
.tsec h3{margin:0 0 10px;font:900 20px/1.1 var(--font-display);display:flex;justify-content:space-between;align-items:baseline}
.tsec h3 span{font:700 12px var(--font-body);color:var(--ink-soft)}
.route{position:relative;display:flex;flex-direction:column;gap:10px}
.route::before{content:"";position:absolute;left:21px;top:20px;bottom:20px;border-left:3px dashed var(--ink-navy);opacity:.35}
.rstop{position:relative;display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--ink-navy);border-radius:14px;background:var(--paper-card);box-shadow:3px 3px 0 var(--ink-navy)}
.rstop.done{background:var(--stamp-gold-wash)}
.rstop .num{position:absolute;left:-8px;top:-8px;width:22px;height:22px;border-radius:50%;background:var(--ink-navy);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper-card)}
.rstop .sq{width:44px;height:44px;border:2px solid var(--ink-navy);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.rinfo b{font:900 17px/1.1 var(--font-display);display:flex;align-items:center}
.rinfo b .miniflag{width:16px;height:16px;margin-right:6px;border-width:1.5px}
.rinfo span{font-size:11px;color:var(--ink-soft)}
.timing{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:999px;border:1.5px solid}
.timing.good{color:#1E7A4A;border-color:#2FBF71;background:#DDF7E8}
.timing.meh{color:#9A5B00;border-color:#FFB020;background:#FFF1D1}
.rbtns{display:flex;flex-direction:column;gap:4px}
.rbtns button{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--ink-navy);display:flex;align-items:center;justify-content:center;background:var(--paper-card)}
.rbtns button[disabled]{opacity:.3}
.addcities{display:flex;flex-wrap:wrap;gap:6px}
.addcities button{display:flex;align-items:center;gap:2px;padding:4px 10px 4px 6px;border:2px dashed var(--ink-navy);border-radius:999px;font-size:12px;font-weight:700;background:none}
.addcities button .miniflag{width:16px;height:16px;margin-right:4px;border-width:1.5px}
.pack{display:flex;flex-direction:column;gap:6px}
.pack label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--ink-navy);border-radius:12px;background:var(--paper-card);font-size:14px;font-weight:600;cursor:pointer}
.pack input[type=checkbox]{width:20px;height:20px;accent-color:var(--city-kyoto)}
.pack label.ok span{text-decoration:line-through;color:var(--ink-soft)}
.packadd{display:flex;gap:8px}
.packadd input{flex:1;min-width:0;height:44px;border:2px solid var(--ink-navy);border-radius:12px;padding:0 12px;font:600 14px var(--font-body);background:var(--paper-card);color:var(--ink-navy)}
.packadd button{width:44px;height:44px;border-radius:12px;background:var(--ink-navy);color:#fff;display:flex;align-items:center;justify-content:center}
.tdel{display:block;margin:6px auto 0;font-size:13px;font-weight:600;color:var(--ink-soft);text-decoration:underline}
.intrip{font-size:12px;font-weight:700;color:var(--ink-soft);text-align:center;margin-top:-4px}

/* ---------- app icon + launch ---------- */
.launch{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#1B1F4B;animation:launchbg .5s .95s both}
.launch svg{animation:launchicon 1.25s cubic-bezier(.5,0,.3,1) both;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
@keyframes launchicon{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.06);opacity:1}55%{transform:scale(1)}100%{transform:scale(9);opacity:0}}
@keyframes launchbg{to{opacity:0;visibility:hidden}}
.iconrow{display:flex;align-items:flex-end;gap:14px;padding:6px 0 4px}
.iconrow figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--ink-soft)}
.iconrow svg{display:block;filter:drop-shadow(0 3px 6px rgba(27,31,75,.25))}
/* ---------- trip memories ---------- */
.memo{position:relative;padding:16px;border:2px solid var(--ink-navy);border-radius:16px;background:var(--paper-card);box-shadow:5px 5px 0 var(--ink-navy);overflow:hidden;
  background-image:linear-gradient(transparent 27px,rgba(232,169,58,.22) 28px),var(--grain);background-size:100% 28px,auto}
.memo .mring{position:absolute;right:-14px;top:-14px;width:118px;height:118px;border-radius:50%;border:4px solid var(--stamp-red);color:var(--stamp-red);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(14deg);font-size:9px;font-weight:800;letter-spacing:.1em;mix-blend-mode:multiply;opacity:.85;padding:14px}
.memo .mring b{font:900 12px/1.05 var(--font-display);letter-spacing:0;margin:2px 0}
.memo>p{margin:0 120px 12px 0;font-size:13px;color:var(--ink-soft);line-height:1.4}
.memo>p b{display:block;font:900 22px/1.1 var(--font-display);color:var(--ink-navy)}
.mstamps{display:flex;flex-wrap:wrap;gap:12px;padding-top:4px}
.mst{width:86px;padding:6px 6px 8px;background:var(--paper-cream);border:2px dashed var(--ink-navy);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;box-shadow:2px 2px 0 rgba(27,31,75,.25);animation:drop .5s both}
.mst:nth-child(odd){transform:rotate(-4deg)}.mst:nth-child(even){transform:rotate(3deg)}
.mst .sq{width:58px;height:54px;border:2px solid var(--ink-navy);display:flex;align-items:center;justify-content:center}
.mst b{font:900 13px/1.05 var(--font-display)}
.mst span{font-size:10px;font-weight:700;color:var(--stamp-red);letter-spacing:.04em}
.mst em{font-style:normal;font-size:9px;font-weight:800;color:#fff;background:var(--accent-plum);border-radius:999px;padding:1px 6px}
.mpc{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.mpc h4{margin:0;font:900 15px/1.1 var(--font-display)}
.mpc div{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mnone{padding:14px;border:2px dashed var(--ink-soft);border-radius:12px;font-size:13px;line-height:1.45;color:var(--ink-soft);text-align:center}
.tmemo{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:800;color:var(--stamp-red)}
.tmemo i{display:inline-flex;width:22px;height:22px;border:1.5px dashed var(--ink-navy);align-items:center;justify-content:center;background:var(--paper-cream);transform:rotate(-6deg)}
.tripnote{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 10px;border-radius:999px;background:var(--stamp-gold-wash);border:1.5px solid var(--stamp-gold);font-size:12px;font-weight:800;color:var(--ink-navy)}

/* ---------- verified + event stamps ---------- */
.hereacts{display:flex;flex-direction:column;gap:8px}
.ghost.small{height:36px;font-size:13px;text-decoration:underline}
.locnote{padding:12px;border:2px dashed var(--ink-soft);border-radius:12px;font-size:13px;line-height:1.45;color:var(--ink-navy);display:flex;flex-direction:column;gap:8px;background:var(--paper-cream)}
.locnote .row{display:flex;gap:8px}.locnote .row button{flex:1;height:38px;border-radius:10px;border:2px solid var(--ink-navy);font-size:12px;font-weight:700;background:var(--paper-card)}
.locnote .row button.pri{background:var(--ink-navy);color:var(--paper-cream)}
.vchip{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;padding:3px 10px 3px 6px;border-radius:999px;background:#DDF7E8;border:1.5px solid #2FBF71;color:#1E7A4A;font-size:12px;font-weight:800}
.vchip.past{background:var(--paper-cream);border-color:var(--ink-soft);color:var(--ink-soft)}
.tile .vdot{position:absolute;top:-7px;left:-7px;width:20px;height:20px;border-radius:50%;background:#2FBF71;color:#fff;border:2px solid var(--ink-navy);display:flex;align-items:center;justify-content:center}
.tile{position:relative}
.tile.evst{border:2px solid transparent;background:linear-gradient(var(--paper-card),var(--paper-card)) padding-box,conic-gradient(#FF8A3D,#FF4F8B,#9D4EFF,#3D7BFF,#00B2A9,#FFC21F,#FF8A3D) border-box;animation:gglow 2.4s ease-in-out infinite}
.tile .evb{position:absolute;bottom:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--city-kyoto);color:#fff;border:2px solid var(--ink-navy);display:flex;align-items:center;justify-content:center}
.evbanner{position:relative;padding:12px 14px;border-radius:12px;border:2px solid var(--ink-navy);background:linear-gradient(120deg,#FFE38A,#FFB3C7 60%,#D4C2FF);font-size:13px;line-height:1.4;box-shadow:3px 3px 0 var(--ink-navy);overflow:hidden}
.evbanner b{display:flex;align-items:center;gap:6px;font:900 16px/1.2 var(--font-display);margin-bottom:2px}
.evbanner.live{animation:evglow 2.2s ease-in-out infinite}
.evbanner.soon{background:var(--paper-cream)}
@keyframes evglow{50%{box-shadow:3px 3px 0 var(--ink-navy),0 0 18px 6px rgba(255,79,139,.55)}}
.pin .evp{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#FF4F8B,#9D4EFF);color:#fff;border:2px solid var(--ink-navy);display:flex;align-items:center;justify-content:center;animation:pinglow 1.6s ease-in-out infinite}
.evlist{display:flex;flex-direction:column;gap:8px}
.evrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--ink-navy);border-radius:12px;background:var(--paper-card)}
.evrow.got{background:linear-gradient(120deg,#FFE38A,#FFB3C7 60%,#D4C2FF)}
.evrow.live{border-style:dashed;animation:evglow 2.2s ease-in-out infinite}
.evrow .sq{width:38px;height:38px;border:2px solid var(--ink-navy);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.evrow div{flex:1;min-width:0;display:flex;flex-direction:column}
.evrow b{font:900 14px/1.2 var(--font-display)}.evrow span{font-size:11px;color:var(--ink-soft)}
.evrow em{font-style:normal;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--ink-navy);color:#fff;flex-shrink:0}
.honest{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:4px;padding:4px 10px;border-radius:999px;background:#DDF7E8;border:1.5px solid #2FBF71;color:#1E7A4A;font-size:12px;font-weight:800}

/* ---------- weekly challenges ---------- */
.week{margin:0 20px 18px;padding:14px;border:2px solid var(--ink-navy);border-radius:18px;background:linear-gradient(150deg,#D4C2FF,#FFB3C7 55%,#FFE38A);box-shadow:5px 5px 0 var(--ink-navy);display:flex;flex-direction:column;gap:10px}
.week .wh{display:flex;justify-content:space-between;align-items:baseline}
.week .wh b{font:900 22px/1.1 var(--font-display)}
.week .wh span{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--ink-navy);color:#fff}
.week p{margin:0;font-size:12px;font-weight:600}
.chal{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--ink-navy);border-radius:14px;background:var(--paper-card)}
.chal.done{animation:newglow 1.8s ease-in-out infinite;background:#DDF7E8}
.chal .ci{width:36px;height:36px;border-radius:50%;background:var(--ink-navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chal.done .ci{background:#2FBF71}
.chal .cm{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.chal .cm b{font-size:14px}
.chal .cm small{font-size:11px;color:var(--ink-soft)}
.chal .bar{height:8px}
.chal .rw{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;width:58px;text-align:center}
.chal .rw .face{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid var(--ink-navy);background:#fff;display:block}
.chal .rw .face svg{display:block;margin-top:-3px}
.chal .rw em{font-style:normal;font-size:9px;font-weight:800;line-height:1.1}
.chal:not(.done) .rw .face{filter:grayscale(.7);opacity:.75}
.prop{transform-box:view-box;transform-origin:60px 12px;animation:propspin .45s linear infinite}
@keyframes propspin{50%{transform:scaleX(-.6)}}

/* ---------- friends ---------- */
#nav button{position:relative;min-width:56px}
.navdot{position:absolute;top:-2px;right:12px;width:12px;height:12px;border-radius:50%;background:var(--city-kyoto);border:2px solid var(--paper-card)}
#friends{position:absolute;inset:0;background:var(--paper-cream);background-image:var(--grain);z-index:8}
#fscroll{position:absolute;top:54px;bottom:84px;left:0;right:0;overflow-y:auto;padding-bottom:28px}
.codecard{margin:0 20px 18px;padding:14px;border:2px solid var(--ink-navy);border-radius:16px;background:var(--ink-navy);color:#fff;display:flex;align-items:center;gap:12px;box-shadow:4px 4px 0 var(--city-kyoto)}
.codecard .face{width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid #fff;background:#fff;flex-shrink:0;display:block}
.codecard .face svg{display:block;margin-top:-4px}
.codecard div{flex:1;min-width:0}.codecard small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:#FFC21F}
.codecard b{display:block;font:900 22px/1.1 var(--font-display);letter-spacing:.04em}
.codecard button{height:38px;padding:0 12px;border-radius:999px;background:#FFC21F;color:var(--ink-navy);font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;flex-shrink:0}
.fcard{margin:0 20px 14px;padding:12px;border:2px solid var(--ink-navy);border-radius:16px;background:var(--paper-card);box-shadow:4px 4px 0 var(--ink-navy);display:flex;flex-direction:column;gap:10px}
.fcard .ftop{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.fcard .face,.fhero .face{width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid var(--ink-navy);background:#fff;flex-shrink:0;display:block}
.fcard .face svg,.fhero .face svg{display:block;margin-top:-4px}
.fcard .fmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fcard .fmeta b{font:900 20px/1.1 var(--font-display)}
.fcard .fmeta span{font-size:12px;color:var(--ink-soft)}
.fcard .fmeta em{font-style:normal;font-size:12px;font-weight:800;color:var(--accent-plum)}
.fcard .fbtns{display:flex;gap:8px}.fcard .fbtns button{flex:1;height:38px;border-radius:10px;border:2px solid var(--ink-navy);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--paper-card)}
.fcard .fbtns button.pri{background:var(--ink-navy);color:var(--paper-cream)}
.inbox{display:flex;gap:12px;overflow-x:auto;padding:4px 20px 12px}
.inbox .mini{position:relative}
.inbox .mini.unread::after{content:"NEW";position:absolute;top:-8px;left:-6px;background:var(--city-kyoto);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px;border:1.5px solid var(--ink-navy)}
.inbox .from{position:absolute;bottom:6px;right:6px;width:28px;height:28px;border-radius:50%;overflow:hidden;border:2px solid var(--ink-navy);background:#fff}
.inbox .from svg{display:block;margin-top:-2px}
.fhero{margin:4px 20px 18px;padding:16px;border:2px solid var(--ink-navy);border-radius:20px;background:linear-gradient(150deg,#D4C2FF,#FFB3C7);box-shadow:5px 5px 0 var(--ink-navy);display:flex;align-items:center;gap:14px}
.fhero .face{width:76px;height:76px}
.fhero b{display:block;font:900 28px/1.05 var(--font-display)}
.fhero span{font-size:13px;font-weight:700}
.cmp{margin:0 20px 18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.cmp div{padding:10px 6px;border:2px solid var(--ink-navy);border-radius:12px;background:var(--paper-card)}
.cmp b{display:block;font:900 26px/1 var(--font-display)}.cmp span{font-size:11px;font-weight:700;color:var(--ink-soft)}
.cmp .both{background:var(--stamp-gold-wash)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips button{display:flex;align-items:center;padding:4px 10px 4px 5px;border:2px solid var(--ink-navy);border-radius:999px;font-size:12px;font-weight:700;background:var(--paper-card)}
.fchips button .miniflag{width:16px;height:16px;margin-right:5px;border-width:1.5px}
.fchips.both button{background:var(--stamp-gold-wash)}.fchips.theirs button{border-style:dashed}
.sendto{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sendto button{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border:2px solid var(--ink-navy);border-radius:999px;font-size:12px;font-weight:700;background:var(--paper-card)}
.sendto button.txt{padding:5px 12px}
.sendto button.on{background:var(--ink-navy);color:var(--paper-cream)}
.sendto .face{width:24px;height:24px;border-radius:50%;overflow:hidden;background:#fff;display:block}
.sendto .face svg{display:block;margin-top:-2px}

/* ---------- trip planner + recap ---------- */
.rmap{margin-bottom:12px;border:2px solid var(--ink-navy);border-radius:16px;overflow:hidden;box-shadow:4px 4px 0 var(--ink-navy);background:var(--map-ocean)}
.rmap svg{display:block}
.rmap .rline{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.leg{display:flex;align-items:center;gap:8px;margin:-2px 0 -2px 34px;padding:2px 10px;font-size:11px;font-weight:700;color:var(--ink-soft)}
.leg svg{color:var(--ink-navy)}
.route.dragmode .leg{display:none}
.rstop.dragging{z-index:5;box-shadow:6px 10px 0 var(--ink-navy),0 0 22px 6px rgba(255,194,31,.6);transition:none!important;cursor:grabbing}
.route.dragmode .rstop{transition:transform .18s ease}
.grip{cursor:grab;touch-action:none;background:var(--stamp-gold-wash)!important}
.wx{display:flex;align-items:center;gap:4px;font-size:11px!important;font-weight:700;color:var(--ink-navy)!important}
.sugg{margin-top:12px;padding:12px;border:2px dashed var(--accent-plum);border-radius:14px;background:#F3ECFF}
.sugg h4{margin:0 0 8px;display:flex;align-items:center;gap:6px;font:900 15px/1.2 var(--font-display);color:var(--accent-plum)}
.sgchips{display:flex;flex-wrap:wrap;gap:6px}
.sgchips button{display:flex;align-items:center;gap:4px;padding:5px 10px 5px 7px;border:2px solid var(--ink-navy);border-radius:999px;background:var(--paper-card);font-size:12px;font-weight:700}
.sgchips em{font-style:normal;font-weight:500;color:var(--ink-soft);margin-left:2px}
.recapbtn{margin-top:12px;height:42px;padding:0 16px;border-radius:999px;border:2px solid var(--ink-navy);background:#fff;color:var(--ink-navy);font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:8px;animation:newglow 1.8s ease-in-out infinite}

.rbars{position:absolute;top:58px;left:14px;right:14px;display:flex;gap:4px;z-index:3}

.rslide .rmapbig svg{display:block}
.rslide .rmapbig .rline2{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:drawline 2.4s .3s ease-in-out forwards}
@keyframes drawline{to{stroke-dashoffset:0}}
.rslide .rmapbig .dot{transform-box:fill-box;transform-origin:center;animation:pop .4s both cubic-bezier(.3,1.5,.5,1)}
.rstamps{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.rstamps .mst{color:var(--ink-navy);animation:slam .6s both cubic-bezier(.2,.9,.3,1)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.nums div{padding:14px 8px;border-radius:16px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);animation:rise .45s both}
.nums b{display:block;font:900 40px/1 var(--font-display)}
.nums span{font-size:12px;font-weight:700}
.rslide .btn{width:100%}
.rslide .btn.light{background:#fff;color:var(--ink-navy);box-shadow:4px 4px 0 rgba(0,0,0,.25)}

/* ---------- account sync + offline ---------- */
.syncpill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1.5px solid var(--ink-soft);color:var(--ink-soft);background:var(--paper-card)}
.syncpill.synced{border-color:#3D7BFF;color:#2A5FD6;background:#E6EEFF}
.syncpill.saving,.syncpill.loading{border-style:dashed}
.syncpill.offline,.syncpill.error{border-color:#FFB020;color:#9A5B00;background:#FFF1D1}
.cover-sunset .syncpill{background:rgba(255,255,255,.9)}
#offline{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:13;display:none;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#1B1F4B;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 0 0 2px #FFB020}
#offline.on{display:flex}

/* ---------- past visits: blue memory ink ---------- */
:root{--memory:#3D7BFF}
.vmark.past{border-color:var(--memory);color:var(--memory)}
.bigring.past,.ring.past{border-color:var(--memory)}.bigring.past>div,.ring.past>div{border-color:var(--memory);color:var(--memory)}
.pin.past .tick{background:var(--memory)}
.tile.past{border-color:var(--memory)}
.tile .pdot{position:absolute;top:-7px;left:-7px;width:20px;height:20px;border-radius:50%;background:var(--memory);color:#fff;border:2px solid var(--ink-navy);display:flex;align-items:center;justify-content:center}
.vchip.past{background:#E6EEFF;border-color:var(--memory);color:#2A5FD6}
.pastform{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px solid var(--memory);border-radius:12px;background:#E6EEFF;animation:pop .25s both}
.pastform b{font:900 16px/1.2 var(--font-display)}
.pastform span{font-size:12px;line-height:1.4;color:var(--ink-soft)}
.btn.blue{background:var(--memory);color:#fff;box-shadow:4px 4px 0 var(--ink-navy)}
.locnote .spin{display:inline-block;width:14px;height:14px;margin-left:6px;vertical-align:-2px;border:2px solid var(--ink-soft);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.inklegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:2px}
.inklegend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid currentColor}
.cover-sunset .inklegend{color:#fff}

/* ---------- semi-unlocked past visits ---------- */
.tile.past .sq,.kt.past .sq{background:#E6EEFF!important;border:2px dashed var(--memory)}
.tile.past b,.kt.past b{color:#2A5FD6}
.upgrade{padding:12px;border:2px dashed var(--memory);border-radius:12px;background:#E6EEFF;display:flex;flex-direction:column;gap:8px}
.upgrade b{font:900 16px/1.2 var(--font-display)}.upgrade span{font-size:12px;line-height:1.4;color:var(--ink-soft)}
.pastgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pastgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:2px dashed var(--memory);border-radius:14px;background:#F0F5FF;text-align:center}
.pastgrid b{font:900 13px/1.1 var(--font-display);color:#2A5FD6}.pastgrid span{font-size:10px;font-weight:700;color:var(--ink-soft)}
.pastnote{margin:0;font-size:12px;line-height:1.4;color:var(--ink-soft)}
.addpast{height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--memory);color:#2A5FD6;background:#fff;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px;align-self:flex-start}
#pastSheet{position:absolute;inset:0;z-index:40;background:var(--paper-cream);background-image:var(--grain);display:none;flex-direction:column}
#pastSheet.on{display:flex;animation:up .35s cubic-bezier(.3,.7,.2,1) both}
#pastSheet .mhead{padding-top:58px}
.pslist{flex:1;overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;gap:14px}
.pscountry b{display:flex;align-items:center;font:900 16px/1.2 var(--font-display);margin-bottom:6px}
.pscountry b .miniflag{width:18px;height:18px;margin-right:6px;border-width:1.5px}
.pschips{display:flex;flex-wrap:wrap;gap:6px}
.pschips button{padding:6px 12px;border:2px solid var(--ink-navy);border-radius:999px;font-size:13px;font-weight:700;background:var(--paper-card)}
.pschips button.on{background:var(--memory);border-color:var(--memory);color:#fff}
.pschips button[disabled]{opacity:.45;text-decoration:line-through}
.psfoot{padding:12px 20px 28px;border-top:2px solid var(--ink-navy);background:var(--paper-card);display:flex;flex-direction:column;gap:10px}
.psfoot .fld{flex-direction:row;align-items:center;justify-content:space-between}
.psfoot .fld input{width:170px}
/* ---------- postcard country outlines ---------- */
.pcfront .outline{position:absolute;left:12px;top:12px;width:150px;height:104px;pointer-events:none}
.pcfront .outline svg{width:100%;height:100%;overflow:visible}
.pcfront .outline .pulse{transform-box:fill-box;transform-origin:center;animation:opulse 1.6s ease-out infinite}
@keyframes opulse{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
.mini .mo{position:absolute;left:8px;top:8px;width:62px;height:46px;opacity:.9}
.mini .mo svg{width:100%;height:100%;overflow:visible}

/* ---------- real map style ---------- */
.land.real path{stroke-linejoin:round;stroke-linecap:round}
.mapbadge{position:absolute;left:12px;bottom:96px;z-index:4;padding:3px 9px;border-radius:999px;background:rgba(27,31,75,.75);color:#fff;font-size:10px;font-weight:700;pointer-events:none}

/* ---------- past-visit postmark on the card + moments ---------- */
.pastmk{position:absolute;bottom:10px;right:10px;padding:4px 6px 2px 2px;background:var(--paper-card);border:2px solid #3D7BFF;border-radius:14px;transform:rotate(-9deg);box-shadow:2px 2px 0 rgba(27,31,75,.35);display:flex}
.pastmk svg{display:block}
.pastmk.press{animation:press .45s cubic-bezier(.2,.9,.3,1.2) both}
.cmtile.pastt,.cornerst.pastt{border-color:#3D7BFF;background:#EEF3FF}
.cmtile.pastt b,.cornerst.pastt b{color:#3D7BFF}
.kt .pst{width:56px;height:56px;display:flex;align-items:center;justify-content:center}

/* ---------- bold country shape behind postcards ---------- */
.pcfront .big{position:absolute;left:4%;right:28%;top:-4%;bottom:-4%;pointer-events:none;z-index:0}
.pcfront .big svg,.dcard .big svg,.mini .mo svg{width:100%;height:100%;overflow:visible}
.pcfront>*:not(.big){position:relative;z-index:1}.pcfront>.stp{position:absolute}
.pcfront h2,.pcfront .gf,.pcfront .ct,.dcard b,.dcard .gf,.dcard .ct{text-shadow:0 0 2px var(--pcbg),0 0 4px var(--pcbg),0 0 8px var(--pcbg),0 0 14px var(--pcbg)}
.big .pulse{transform-box:fill-box;transform-origin:center;animation:opulse 1.6s ease-out infinite}
.big .shape{animation:shapein .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes shapein{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.big .shape{transform-box:fill-box;transform-origin:center}
.big .pin{transform-box:fill-box;transform-origin:50% 100%;animation:pinbob 1.8s ease-in-out infinite}
@keyframes pinbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12%)}}
.dcard .big{position:absolute;left:0;right:30%;top:-6%;bottom:-6%;pointer-events:none}
.dcard>*:not(.big){position:relative}.dcard>.stp{position:absolute}
.mini .mo{position:absolute;left:4px;right:34%;top:2px;bottom:2px;width:auto;height:auto;opacity:1;pointer-events:none}
.mini>b,.mini>span:not(.mo):not(.in){position:relative}

/* ---------- cartoon envelope ---------- */
.env{width:310px;height:330px}
.env .ebody,.env .pocket,.env .flap{background:none;border:0;clip-path:none;border-radius:0}
.env .ebody svg,.env .pocket svg,.env .flap svg{display:block;width:100%;height:100%;overflow:visible}
.env .ebody{z-index:1}
.env .pocket{z-index:3}
.env .flap{z-index:4;bottom:62px;height:108px;transform-origin:50% 0;animation:flap2 .55s 1.35s both cubic-bezier(.4,1.6,.5,1)}
@keyframes flap2{0%{transform:rotateX(0)}100%{transform:rotateX(180deg);z-index:0}}
.envbob{position:absolute;inset:0;animation:envin .7s .15s both cubic-bezier(.3,1.5,.5,1),envwig .5s .85s ease-in-out}
@keyframes envin{0%{transform:translateY(-260px) rotate(-14deg) scale(.7);opacity:0}60%{transform:translateY(12px) rotate(3deg) scaleY(.88) scaleX(1.08);opacity:1}80%{transform:translateY(-6px) scaleY(1.04) scaleX(.97)}100%{transform:none}}
@keyframes envwig{0%,100%{transform:none}20%{transform:rotate(-5deg) scale(1.03)}40%{transform:rotate(5deg) scale(1.05)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
.env .dcard{animation:cardup2 .8s 1.7s both cubic-bezier(.3,1.5,.5,1)}
@keyframes cardup2{0%{transform:none}60%{transform:translateY(-122px) rotate(-6deg) scale(1.04)}100%{transform:translateY(-102px) rotate(-3deg)}}
.env~.dnote{margin-top:24px}
.env .envseal{width:38px;height:38px;margin-left:-19px;bottom:48px;background:none;border:0;border-radius:0;animation:seal2 .5s 1.15s both ease-out}
.env .envseal svg{display:block;width:100%;height:100%}
@keyframes seal2{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(-12deg)}100%{transform:translateY(-40px) scale(0) rotate(40deg);opacity:0}}
.ef .eye{transform-box:fill-box;transform-origin:center;animation:blink 3.2s 2.4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ef .sad{animation:hide 0s 1.2s both}.ef .happy{opacity:0;animation:show 0s 1.2s both}
@keyframes hide{to{opacity:0}}@keyframes show{to{opacity:1}}
.esp{position:absolute;z-index:6;width:22px;height:22px;left:50%;bottom:160px;margin-left:-11px;opacity:0;pointer-events:none;animation:spk .9s calc(1.2s + var(--d,0s)) both cubic-bezier(.2,.8,.3,1)}
@keyframes spk{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}25%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.1) rotate(180deg)}}
.esp svg{width:100%;height:100%;display:block}
.speed{position:absolute;inset:0;pointer-events:none;z-index:0}
.speed i{position:absolute;height:4px;border-radius:4px;background:rgba(255,252,242,.55);animation:speedl .5s .25s both ease-out}
@keyframes speedl{from{transform:scaleX(0);opacity:1}to{transform:scaleX(1);opacity:0}}

/* ---------- send: postcard slips into an envelope that flies away ---------- */
.pcstage{position:relative}
.senv{position:absolute;left:50%;top:78px;width:300px;height:184px;margin-left:-150px;pointer-events:none;animation:senvin .4s both cubic-bezier(.3,1.5,.5,1)}
.senv .sb,.senv .sp,.senv .sf{position:absolute;left:0;right:0}
.senv svg{display:block;width:100%;height:100%;overflow:visible}
.senv .sb{bottom:0;height:184px;z-index:0}
.senv .sp{bottom:0;height:184px;z-index:3}
.senv .sf{top:0;height:110px;z-index:4;transform-origin:50% 0;transform:rotateX(180deg);opacity:.95}
.senv.shut .sf{animation:sflap .35s both cubic-bezier(.4,1.6,.5,1)}
@keyframes sflap{from{transform:rotateX(180deg)}to{transform:rotateX(0)}}
@keyframes senvin{from{transform:translateY(140px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.pc.into{animation:into .55s both cubic-bezier(.5,0,.6,1)}
.pc{z-index:2}.senv.sbk{z-index:1}.senv.sfr{z-index:3}
@keyframes into{0%{transform:none}35%{transform:translateY(-26px) scale(.82) rotate(-3deg)}100%{transform:translateY(96px) scale(.8) rotate(0)}}
.pc.flip.into{animation-name:intof}
@keyframes intof{0%{transform:rotateY(180deg)}35%{transform:rotateY(180deg) translateY(-26px) scale(.82) rotate(3deg)}100%{transform:rotateY(180deg) translateY(96px) scale(.8)}}
.senv .wing{position:absolute;top:40px;width:70px;height:46px;z-index:-1;opacity:0;transition:opacity .2s}
.senv .wing.l{left:-52px;transform-origin:100% 80%}.senv .wing.r{right:-52px;transform-origin:0 80%}
.senv.wings .wing{opacity:1}.senv.wings .wing.l{animation:flapl .18s infinite alternate ease-in-out}.senv.wings .wing.r{animation:flapr .18s infinite alternate ease-in-out}
@keyframes flapl{from{transform:rotate(18deg)}to{transform:rotate(-28deg)}}
@keyframes flapr{from{transform:rotate(-18deg)}to{transform:rotate(28deg)}}
.senv .seal2{position:absolute;left:50%;top:84px;width:40px;height:40px;margin-left:-20px;z-index:5;transform:scale(0)}
.senv.sealed .seal2{animation:sealin .35s both cubic-bezier(.3,1.8,.5,1)}
@keyframes sealin{from{transform:scale(2.2) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.senv.fly{animation:sfly .95s both cubic-bezier(.5,-.3,.7,.4)}
@keyframes sfly{0%{transform:none}20%{transform:translateY(16px) scaleY(.85) scaleX(1.08)}45%{transform:translate(20px,-60px) rotate(-8deg)}100%{transform:translate(320px,-560px) rotate(-24deg) scale(.4)}}
.trail{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--city-lisbon);border:2px solid var(--ink-navy);pointer-events:none;z-index:6;animation:trail .7s both ease-out}
@keyframes trail{from{transform:scale(1);opacity:1}to{transform:scale(.2);opacity:0}}

/* ---------- blue past-visit stamp: map pins, country panel, passport ---------- */
.pin.past .disc{background:#EEF3FF!important;border:3px dashed var(--memory)}
.pin.past .lbl{border-color:var(--memory);color:#2A5FD6}
.tile.past .sq,.kt.past .sq{border:0!important;background:none!important;width:62px;height:58px}
.bkeys{display:flex;gap:8px}
.bkeys button{flex:1;min-width:0;height:66px;border:2px solid var(--ink-navy);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--paper-cream);padding:2px}
.bkeys button b{font:900 11px/1 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bkeys .sq{width:38px;height:38px;border:2px solid var(--ink-navy);border-radius:6px;display:flex;align-items:center;justify-content:center}
.bkeys .todo{border-style:dashed;color:var(--ink-soft);background:none}.bkeys .todo .sq{border-style:dashed}
.bkeys .past{border:2px dashed var(--memory);background:#EEF3FF;color:#2A5FD6}.bkeys .past .sq{border:0;width:44px;height:40px}
/* ---------- bigger flags ---------- */
.pcfront .ct .miniflag{width:30px;height:30px;margin-right:8px;border-width:2px}.pcfront .ct{font-size:15px}
.dcard .ct .miniflag{width:26px;height:26px;margin-right:7px;border-width:2px}
.banner .ct .miniflag{width:26px;height:26px;margin-right:8px;border-width:2px}
/* ---------- route doodle on the postcard back ---------- */
.pcroute{display:block;width:100%;height:40px;margin:2px 0}
.pcroute .plane{animation:planego 2.6s ease-in-out infinite}
@keyframes planego{0%{offset-distance:0%}100%{offset-distance:100%}}
/* ---------- incoming mail: envelope flies in and opens ---------- */
.senv.arrive{animation:sarrive .8s both cubic-bezier(.2,.9,.3,1.1)}
@keyframes sarrive{0%{transform:translate(-300px,-520px) rotate(-24deg) scale(.4);opacity:0}15%{opacity:1}75%{transform:translate(0,14px) scaleY(.86) scaleX(1.08)}100%{transform:none}}
.senv.sfr.closed .sf{transform:none}
.senv.sfr.open .sf{animation:sopen .45s both cubic-bezier(.4,1.6,.5,1)}
@keyframes sopen{from{transform:rotateX(0)}to{transform:rotateX(180deg)}}
.senv.sfr.closed .seal2{transform:scale(1) rotate(-8deg)}
.senv.sfr.pop .seal2{animation:spop .45s both ease-out}
@keyframes spop{0%{transform:scale(1) rotate(-8deg)}40%{transform:scale(1.5) rotate(-20deg)}100%{transform:translateY(-60px) scale(0) rotate(50deg);opacity:0}}
.senv.leave{animation:sleave .5s both ease-in}
@keyframes sleave{to{transform:translateY(160px) scale(.8);opacity:0}}
.pc.outof{animation:outof .7s both cubic-bezier(.3,1.4,.5,1)}
@keyframes outof{0%{transform:translateY(96px) scale(.8)}55%{transform:translateY(-34px) scale(.95) rotate(-3deg)}100%{transform:none}}
.pc.flip.outof{animation-name:outoff}
@keyframes outoff{0%{transform:rotateY(180deg) translateY(96px) scale(.8)}55%{transform:rotateY(180deg) translateY(-34px) scale(.95) rotate(3deg)}100%{transform:rotateY(180deg)}}
.pc.hid{visibility:hidden}

/* ---------- Places I've been: blue memory page in the passport ---------- */
.beenpage{margin:16px 20px 0;position:relative;border:3px solid var(--memory);border-radius:16px;padding:16px;background:#EEF4FF;background-image:repeating-linear-gradient(135deg,rgba(61,123,255,.06) 0 2px,transparent 2px 12px);box-shadow:5px 5px 0 #2A5FD6;overflow:hidden}
.beenpage .bh{display:flex;align-items:center;gap:12px}
.beenpage .bh .seal{flex-shrink:0;transform:rotate(-10deg)}
.beenpage .bh small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--memory)}
.beenpage .bh h2{margin:2px 0;font:900 24px/1.05 var(--font-display);color:#1F3F99}
.beenpage .bh p{margin:0;font-size:12px;color:#4A5A8A;font-weight:600}
.beenpage .bstats{display:flex;gap:8px;margin:14px 0 4px}
.beenpage .bstats div{flex:1;background:#fff;border:2px solid var(--memory);border-radius:12px;padding:6px 8px;text-align:center}
.beenpage .bstats b{display:block;font:900 22px/1 var(--font-display);color:#2A5FD6}.beenpage .bstats span{font-size:10px;font-weight:800;letter-spacing:.08em;color:#4A5A8A;text-transform:uppercase}
.beenc{margin-top:12px}
.beenc h3{display:flex;align-items:center;justify-content:flex-start;text-align:left;margin:0 0 8px;font:900 15px/1 var(--font-display);color:#1F3F99}.beenc h3 .miniflag{margin-left:0;margin-right:8px}.beenc h3 span:last-child{margin-left:auto;font:800 11px var(--font-body);color:var(--memory)}
.beenrow{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px}
.beenrow button{flex-shrink:0;width:86px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2px dashed var(--memory);border-radius:12px;background:#fff}

/* ---------- past-visit postmark on postcard backs ---------- */
.pcpm.past{border-color:var(--memory);color:var(--memory)}
/* ---------- mailbox shelf on the Friends tab ---------- */
.mailshelf{position:relative;display:flex;gap:16px;overflow-x:auto;padding:16px 26px 8px;margin:0 0 6px}
.mailshelf::before{content:'';position:absolute;left:16px;right:16px;top:74px;height:12px;background:#C98B4E;border:2px solid var(--ink-navy);border-radius:5px;box-shadow:0 4px 0 #9C6532}
.mailshelf button{z-index:1}.mailshelf .who{margin-top:14px}
.mailshelf button{flex-shrink:0;position:relative;width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.mailshelf svg{display:block;filter:drop-shadow(2px 3px 0 rgba(27,31,75,.35))}
.mailshelf .unread svg{animation:mshake 1.8s ease-in-out infinite;transform-origin:50% 100%}
.mailshelf button:nth-child(2) svg{animation-delay:.3s}.mailshelf button:nth-child(3) svg{animation-delay:.6s}
@keyframes mshake{0%,60%,100%{transform:none}64%{transform:rotate(-7deg) translateY(-3px)}70%{transform:rotate(6deg) translateY(-5px)}76%{transform:rotate(-4deg)}82%{transform:rotate(2deg)}}
.mailshelf .nb{position:absolute;top:-8px;right:-4px;padding:2px 7px;border-radius:999px;background:var(--stamp-red);color:#fff;border:2px solid var(--ink-navy);font-size:10px;font-weight:800;z-index:1}
.mailshelf .who{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--ink-navy)}
.mailshelf .who .face{width:20px;height:20px}
/* ---------- collectable envelope styles ---------- */
.envpick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.envpick button{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 6px 4px;border:2px solid var(--ink-navy);border-radius:12px;background:var(--paper-card);font-size:11px;font-weight:800;position:relative}
.envpick button.on{outline:3px solid var(--city-lisbon);outline-offset:1px;background:var(--stamp-gold-wash)}
.envpick button.lock{opacity:.55;border-style:dashed}
.envpick button .lk{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink-navy);color:#fff;display:flex;align-items:center;justify-content:center}
.envpick small{font-size:9px;font-weight:700;color:var(--ink-soft)}
.holo svg,svg.holo{animation:holo 3s linear infinite}
@keyframes holo{to{filter:hue-rotate(360deg)}}
.chal .rw em small{display:block;font-size:9px;color:var(--memory);font-style:normal}

/* ---------- year in review ---------- */
.yircard{margin:16px 20px 0;display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--ink-navy);border-radius:16px;background:var(--ink-navy);color:var(--paper-cream);box-shadow:5px 5px 0 var(--city-lisbon);position:relative;overflow:hidden;width:calc(100% - 40px);text-align:left}
.yircard::before{content:'';position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 85% 50%,rgba(255,194,31,.14) 0 8deg,transparent 8deg 20deg)}

.yircard .yi{flex-shrink:0;width:56px;height:56px;border-radius:14px;background:var(--city-lisbon);border:2px solid var(--paper-cream);display:flex;align-items:center;justify-content:center;color:var(--ink-navy);transform:rotate(-6deg)}
.yircard small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--city-lisbon)}
.yircard b{display:block;font:900 20px/1.1 var(--font-display)}
.yircard span.m{font-size:12px;opacity:.85}
.yircard .go{margin-left:auto;flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--city-lisbon);color:var(--ink-navy);display:flex;align-items:center;justify-content:center;border:2px solid var(--paper-cream)}
#yir{position:absolute;inset:0;z-index:75;display:none;flex-direction:column;align-items:center;background:rgba(15,18,48,.94);padding:54px 0 20px}

.tiles,.ktiles{flex-wrap:wrap}

.acct{margin:16px 20px 0;padding:14px;border:2px solid var(--ink-navy);border-radius:16px;background:var(--paper-card);background-image:var(--grain);box-shadow:4px 4px 0 var(--ink-navy);display:flex;flex-direction:column;gap:10px}

.acct .who small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--stamp-red)}
.acct .who b{display:block;font:900 18px/1.15 var(--font-display)}
.acct .who span.s{font-size:12px;color:var(--ink-soft)}

function scratchSvg(lv, inner){

function lastCity(){ if(lastStamped && visited[lastStamped]) return lastStamped; return Object.keys(visited).sort((a,b)=>visited[a]<visited[b]?-1:visited[a]>visited[b]?1:0).pop(); }

  italy:[30,6,47.5,130], thailand:[30,94.5,21.2,110], morocco:[28,-13.8,36.3,130], africa:[5,-19,38,110], brazil:[9,-75.5,6,120], sa:[6.5,-90,14,110]};
/* the three hand-drawn levels were fitted to known places: x = ax·lon + bx, y = ay·lat + by */
const LV_FIT = {spain:[25, 267.5, -32, 1591.6], france:[23, 138.0, -33, 1856.3], nether:[80, -232.0, -130, 7135.0], germany:[32, -142.08, -50, 2885.0], austria:[42, -364.14, -62, 3288.0], greece:[45, -837.0, -57, 2546.9], turkey:[18, -442.8, -23, 1228.3], korea:[52, -6457.36, -64, 2595.4], uae:[65, -3313.7, -71, 2073.1], egypt:[27, -639.9, -30, 1138.0], safrica:[21, -324.45, -24, -357.8], usa:[6, 762, -7.6, 580.0], uk:[23.2, 269.24, -40, 2491.0], india:[11.6, -771.4, -12.5, 606.25], nepal:[40, -3176.0, -45, 1617.5], srilanka:[85, -6670.5, -85, 990], china:[5.6, -403.2, -6.8, 517.2], swiss:[75, -420.0, -110, 5453.0], world:[1.08,195.5,-1.086,217.2], europe:[6.635,85.4,-7.02,592.7], portugal:[46.317,488.1,-60.051,2682.1]};
const lvAff = lv => LV_FIT[lv] || (([k,lo,la,y0])=>[k,-k*lo,-k,k*la+y0])(LV_PROJ[lv]);

function topoFeatures(topo){
  const tf=topo.transform, arcs=topo.arcs.map(a=>{ let x=0,y=0; return a.map(p=>{ if(!tf) return p; x+=p[0]; y+=p[1]; return [x*tf.scale[0]+tf.translate[0], y*tf.scale[1]+tf.translate[1]]; }); });

function realInner(lv){

      for(const [lon,lat] of r){ const x=cx(ax*lon+bx), y=cy(ay*lat+by); if(Math.abs(x-lx)+Math.abs(y-ly)<1) continue;

function toPhone(el){ const r=el.getBoundingClientRect(), pr=$('#phone').getBoundingClientRect(), s=pr.width/390;

function burst(x, y, s, word, ink){
  const layer=$('#handLayer');
  if(word){ const b=document.createElement('div'); b.className='burst';
    b.style.left=Math.max(6, x-150*s)+'px'; b.style.top=Math.max(58, y-150*s)+'px';
    b.innerHTML=STAR+`<span>${word}</span>`; layer.appendChild(b); setTimeout(()=>b.remove(), 800); }
  const k=Math.max(s,.55), im=document.createElementNS('http://www.w3.org/2000/svg','svg'); im.setAttribute('class','impact');
  im.setAttribute('viewBox','-60 -40 120 80'); Object.assign(im.style,{left:(x-60)+'px',top:(y-40)+'px',transform:`scale(${k})`});
  im.innerHTML='<line x1="-34" y1="-8" x2="-50" y2="-18"/><line x1="-36" y1="6" x2="-54" y2="10"/><line x1="34" y1="-8" x2="50" y2="-18"/><line x1="36" y1="6" x2="54" y2="10"/>';
  layer.appendChild(im); im.animate([{opacity:0,transform:`scale(${k*.6})`},{opacity:1,transform:`scale(${k})`,offset:.3},{opacity:0,transform:`scale(${k*1.15})`}],{duration:420,easing:'ease-out'}).onfinish=()=>im.remove();
  for(let i=0;i<6;i++){ const f=document.createElement('i'), sz=3+Math.random()*4, a=Math.PI*(1.05+i/5*.9)+(Math.random()-.5)*.4, d=(26+Math.random()*26)*Math.max(s,.7);
    f.className='fleck'; if(ink) f.style.background=ink; Object.assign(f.style,{width:sz+'px',height:sz+'px',left:(x-sz/2)+'px',top:(y-sz/2)+'px'}); layer.appendChild(f);
    f.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${-Math.abs(Math.sin(a))*d*.5+6}px) scale(.6)`,opacity:0}],{duration:520,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>f.remove(); }
}
/* Runs the hand so the rubber pad lands on (x, y) in phone coordinates. */
function handStamp({x, y, s=1, plan=ONE_TAP, words=[], hit, c, mood=1, face, ink}){
  return new Promise(done=>{
    if(reduced()){ plan.hits.forEach((_,i)=>hit && hit(i)); return done(); }
    const wrap=document.createElement('div'); wrap.className='handwrap';
    wrap.style.left=(x-130)+'px'; wrap.style.top=(y-210)+'px'; wrap.style.transform=`scale(${s})`;
    wrap.classList.add('m'+Math.min(mood,3), 'o-'+outfit); if(face) wrap.classList.add('f-'+face); wrap.innerHTML=`<div class="hand">${HAND_SVG}</div>`; $('#handLayer').appendChild(wrap);
    const a=wrap.firstChild.animate(plan.frames,{duration:plan.dur, fill:'forwards'});
    /* face: looks up at the hand on the way down, squints on impact, grins after */
    setTimeout(()=>wrap.classList.add('lookup'), plan.dur*.12);
    plan.hits.forEach((o,i)=>setTimeout(()=>{ thud(i?55:(s>1?70:120)+Math.min(mood-1,3)*12, s>1?.45:.28); if(!i) stampSound(c); burst(x,y,s,words[i],ink); hit && hit(i);
      wrap.classList.remove('lookup','happy'); wrap.classList.add('squish');
      setTimeout(()=>{ wrap.classList.remove('squish'); wrap.classList.add('happy'); },300);
      if(i<plan.hits.length-1) setTimeout(()=>{ wrap.classList.remove('happy'); wrap.classList.add('lookup'); }, (plan.hits[i+1]-o)*plan.dur*.55);
    }, o*plan.dur));
    a.onfinish=()=>{ wrap.remove(); done(); };
  });
}

    {duration:2300,easing:'ease-in-out'}).onfinish=()=>t.remove();
  setTimeout(()=>thud(220,.12),420);
}
