function markVisited(id, opts={}){
  if(stamping) return; stamping=true; holdReveal=true;
  const c=CITIES[id].c, upgrade=!!visited[id], isFirst = !upgrade && got(c).length===0, setsBefore = doneSets().map(st=>st.id);
  const now=Date.now(); combo = now-lastStampT < 180000 ? combo+1 : 1; lastStampT = now;
  const sc=$('#sheetScroll'); sc.scrollTop=0;
  const ban=toPhone(sc.querySelector('.banner'));
  const pastHit=!opts.verified;
  handStamp({x:ban.x+ban.w-(pastHit?56:66), y:ban.y+ban.h-(pastHit?52:34), s:.6, c, ink:opts.verified?null:'#3D7BFF', mood:combo, face:MOOD[id], words:[combo>1?`${combo} in a row!`:null], hit:()=>{
    const when=opts.date||today(); visited[id]=when; if(opts.verified) verified[id]=opts.verified; else delete verified[id];
    const ev=(opts.verified||when===today()) && activeEvent(id, when); if(ev) eventStamps[id]={ev:ev.id, date:when};
    justStamped=id; lastStamped=id; refreshCard(); renderPassport();
  }}).then(()=>setTimeout(()=>{
    if(upgrade){ stamping=false; holdReveal=false; justStamped=null; refreshCard(); renderAll(); renderPassport(); chime(); toast(`Full stamp unlocked for ${CITIES[id].name}`); setTimeout(()=>{ lastStamped=null; checkUnlocks(); }, 900); return; }
    stamping=false; closeCard(); renderAll();
    const finish = next => {
      justStamped=null; holdReveal=false; renderAll();
      const fresh = doneSets().filter(st=>!setsBefore.includes(st.id));
      const then = () => { if(next==='passport') tab('passport'); if(next==='postcard') openPostcard(id); setTimeout(()=>{ lastStamped=null; }, 1600); setTimeout(checkUnlocks, 900); };
      fresh.length ? setTimeout(()=>badgeMoment(fresh[0], then), 1500) : then();
    };
    const afterCity = next => next==='gold' ? goldMoment(c, finish) : finish(next);
    if(isFirst) countryMoment(id, finish); else cityMoment(id, afterCity);
  }, 380));
}

  if(a.aura==='sparkle') return [[18,30,1],[100,26,.8],[14,92,.7],[104,84,1],[30,12,.6],[92,120,.7],[22,124,.6]].map(([x,y,k],i)=>`<path class="spk" style="animation-delay:${(i*.23).toFixed(2)}s" d="M${x} ${y-8*k} L${x+2.2*k} ${y-2.2*k} L${x+8*k} ${y} L${x+2.2*k} ${y+2.2*k} L${x} ${y+8*k} L${x-2.2*k} ${y+2.2*k} L${x-8*k} ${y} L${x-2.2*k} ${y-2.2*k}Z" fill="#FFF6C9" stroke="#FFC21F" stroke-width="1"/>`).join('');
  return '';
}

/* ---------- account sync: the passport lives in the viewer's private space in the artifact database ---------- */
let stateReady=false, lastStateStr='', saveT=null;
const SYNC={ref:null, status:'local', saving:false, dirty:false, at:null, lastAt:'', unsub:null};
const ACCT={name:'', signedIn:false};
let DEVID=''; try{ DEVID=localStorage.getItem('pm-dev')||''; if(!DEVID){ DEVID='d'+Math.random().toString(36).slice(2,10); localStorage.setItem('pm-dev',DEVID); } }catch(e){ DEVID='d'+Math.random().toString(36).slice(2,10); }
function snapshotState(){
  return {v:1, visited, unlocked, sent, verified, eventStamps, trips, activeTrip, AVA, outfit, cover, inbox, mailDays, earned:[...earnedWeekly], mailEver, friends:friendIds, mailSeen:mailSeen2.slice(-200)};
}
function applyState(d){
  if(!d || d.v!==1) return;
  if(d.visited) visited=d.visited; if(d.unlocked) unlocked=d.unlocked; if(d.sent) sent=d.sent; if(d.verified) verified=d.verified; if(d.eventStamps) eventStamps=d.eventStamps;
  if(Array.isArray(d.trips)) trips=d.trips; if('activeTrip' in d) activeTrip=d.activeTrip; if(d.AVA) AVA={...AVA, ...d.AVA, bio:{...AVA.bio, ...(d.AVA.bio||{})}};
  if(d.outfit) outfit=d.outfit; if(d.cover) cover=d.cover; if(Array.isArray(d.inbox)) inbox=d.inbox; if(Array.isArray(d.mailDays)) mailDays=d.mailDays;
  if(Array.isArray(d.earned)) d.earned.forEach(k=>earnedWeekly.add(k)); if(d.mailEver) mailEver=true;
  if(Array.isArray(d.friends)) friendIds=d.friends.filter(x=>typeof x==='string'); if(Array.isArray(d.mailSeen)) mailSeen2=d.mailSeen;
}
function loadLocalState(){ try{ const d=JSON.parse(localStorage.getItem('pm-state')||'null'); if(d){ applyState(d.state||d); } }catch(e){} stateReady=true; lastStateStr=JSON.stringify(snapshotState()); }
function saveState(){
  if(!stateReady) return; const str=JSON.stringify(snapshotState()); if(str===lastStateStr) return; lastStateStr=str;
  const savedAt=new Date().toISOString(); try{ localStorage.setItem('pm-state', JSON.stringify({savedAt, state:JSON.parse(str)})); }catch(e){}
  if(!SYNC.ref) return; clearTimeout(saveT); saveT=setTimeout(()=>{ pushState(); publishCard(); }, 1500);
}
async function pushState(){
  if(!SYNC.ref) return;
  if(!navigator.onLine){ SYNC.status='offline'; SYNC.dirty=true; return renderSync(); }
  if(SYNC.saving){ SYNC.dirty=true; return; }
  SYNC.saving=true; SYNC.dirty=false; SYNC.status='saving'; renderSync();
  try{ const savedAt=new Date().toISOString(); SYNC.lastAt=savedAt; await SYNC.ref.set({savedAt, dev:DEVID, state:JSON.parse(JSON.stringify(snapshotState()))}); SYNC.status='synced'; SYNC.at=new Date(); }
  catch(e){ SYNC.status=(e&&e.code==='unavailable')||!navigator.onLine?'offline':'error'; SYNC.dirty=true; }
  SYNC.saving=false; renderSync(); if(SYNC.dirty && SYNC.status==='synced') pushState();
}
async function initSync(){
  if(!(window.claude && window.claude.use)) return renderSync();
  SYNC.status='loading'; renderSync();
  try{
    const [db,user]=await Promise.all([window.claude.use('db').catch(()=>null), window.claude.use('user').catch(()=>null)]);
    const uid = user ? await user.id().catch(()=>null) : null;
    if(!db || !uid){ SYNC.status='local'; return renderSync(); }
    SYNC.ref=db.doc('data/users/'+uid+'/passport'); SOC.db=db; SOC.uid=uid;
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej({code:'unavailable'}),10000));
    const snap=await Promise.race([SYNC.ref.get(), timeout]);
    let localAt=''; try{ localAt=(JSON.parse(localStorage.getItem('pm-state')||'{}').savedAt)||''; }catch(e){}
    const remote = snap.exists ? snap.data() : null;
    ACCT.signedIn=true; user.name().then(n=>{ ACCT.name=n||''; renderSync(); }).catch(()=>{});
    if(remote && remote.state && (remote.savedAt||'') > localAt){ takeRemote(remote); toast('Passport loaded from your account'); }
    else { await pushState(); }
    publishCard(); loadFriends(true); startPostbox(); renderFriends();
    /* live: a stamp made on another device shows up here without a reload */
    if(!SYNC.unsub) SYNC.unsub=SYNC.ref.onSnapshot(sn=>{ const d=sn.exists?sn.data():null;
      if(!d || !d.state || d.dev===DEVID || (d.savedAt||'')<=SYNC.lastAt || SYNC.saving || stamping) return;
      takeRemote(d); toast('Passport updated from your other device'); }, ()=>{ SYNC.unsub=null; });
  }catch(e){ SYNC.status=navigator.onLine?'error':'offline'; SYNC.dirty=true; renderSync(); }
}

function myCard(){ const {bio, no, ...av}=AVA; return {code:myCode(), given:String((AVA.bio&&AVA.bio.given)||'').slice(0,24), home:String((AVA.bio&&AVA.bio.home)||'').slice(0,40), av, cities:{...visited}}; }

async function addFriendByCode(raw){

  const head = cs.length ? `${cs.length} ${cs.length>1?'countries':'country'} and ${nc} ${nc>1?'cities':'city'} stamped.` : 'No stamps yet.';
  $('#passport').className = 'cover-'+cover;
  $('#passport').innerHTML = `<div id="pscroll"><div class="phead"><button class="sndbtn" id="sndBtn" aria-label="${soundOn?'Mute stamp sounds':'Turn stamp sounds on'}">${L(soundOn?LU.vol:LU.mute,20)}</button><span class="eyebrow">Postmark</span><h1>Your passport</h1><p>${head}</p>${syncPillHTML()}${Object.keys(visited).length?`<span class="inklegend"><span><i style="color:var(--stamp-red)"></i>Stamped on the spot</span><span><i style="color:var(--memory)"></i>Past visit</span></span>`:''}${Object.keys(verified).filter(k=>visited[k]).length?`<span class="honest">${L(LU.shield,14)}Verified traveller · ${Object.keys(verified).filter(k=>visited[k]).length} stamps checked by location</span>`:''}</div>
  ${bioHTML()}
  ${cs.length?'':`<div class="empty"><div class="wvav">${avatarSVG(AVA,110)}</div><b>Your passport is empty</b><p>Every city you visit earns a stamp. Pick a place on the map and mark it as visited.</p><button class="btn navy" id="goMap">${L(LU.map,18)}Open the map</button></div>`}
  <div class="pcards">${cs.map(c=>{const K=COUNTRIES[c], n=got(c).length, g=done(c);
    return `<section class="pcard ${g?'gold':''}">
      <div class="prow"><div class="ring ink ${!g&&!K.cities.some(k=>visited[k]&&verified[k])?'past':''}"><div>${g?L(LU.star,12):'<span>ENTRY</span>'}<b>${K.name.toUpperCase()}</b><span>${g?'COMPLETE':dMonth(firstEntry(c))}</span></div></div>
        <div class="pinfo"><b style="display:flex;align-items:center">${miniFlag(c)}${K.name}</b><span>${g?(n<K.cities.length?`Gold · ${n} of ${K.cities.length} cities stamped`:`All ${K.cities.length} cities stamped`):`${n} of ${K.cities.length} key cities`}</span>
          <div class="bar ${g?'gold':''}"><i style="width:${Math.min(1,n/goldNeed(c))*100}%"></i></div></div></div>
      <div class="tiles">${K.cities.map(k=>visited[k]
        ? `<button class="tile re ${eventStamps[k]?'evst':''} ${verified[k]?'':'past'}" data-restamp="${k}" aria-label="Stamp ${CITIES[k].name} again">${verified[k]?`<span class="vdot" title="Verified">${L(LU.check,11,3)}</span>`:`<span class="pdot" title="Past visit">${L(LU.cal,11,2.6)}</span>`}${eventStamps[k]?`<span class="evb">${L(LU.spark,12,2.4)}</span>`:''}<div class="sq" style="${isPast(k)?'':`background:${K.color}`}">${isPast(k)?pastStamp(k,60):lm(CITIES[k].icon,'on').replace('<svg','<svg width="36" height="36"')}</div><b>${CITIES[k].short||CITIES[k].name}</b></button>`
        : `<div class="tile lock">${L(LU.lock,18)}<b>${CITIES[k].short||CITIES[k].name}</b></div>`).join('')}</div></section>`;}).join('')}</div>
  ${weekHTML()}
  ${beenHTML()}
  ${yirCardHTML()}
  <div class="psec"><div class="psh"><h2>Collections</h2><span>${doneSets().length} of ${SETS.length} complete</span></div>
    <div class="sets">${SETS.map(st=>{const n=setGot(st).length, on=n===st.cities.length;
      return `<div class="setc ${on?'on':''}">${badgeSVG(st,on,58)}<b>${st.name}</b><span>${on?'Complete':`${n} of ${st.cities.length}`}</span><small>${st.cities.map(id=>visited[id]?`<i>${CITIES[id].name}</i>`:CITIES[id].name).join(' · ')}</small></div>`}).join('')}</div></div>
  <div class="psec"><div class="psh"><h2>Event stamps</h2><span>${Object.keys(eventStamps).length} collected</span></div><div class="evlist">${EVENTS.map(e=>{ const got2=Object.entries(eventStamps).find(([,v])=>v.ev===e.id), live=e.cities.some(c=>activeEvent(c)&&activeEvent(c).id===e.id), C0=CITIES[got2?got2[0]:e.cities[0]], K0=COUNTRIES[C0.c];
      return `<div class="evrow ${got2?'got':live?'live':''}"><span class="sq" style="background:${K0.color}">${lm(C0.icon,'on').replace('<svg','<svg width="26" height="26"')}</span><div><b>${e.name}</b><span>${e.cities.map(c=>CITIES[c].name).join(' or ')} · ${got2?'collected '+dLong(got2[1].date):e.when}</span></div>${got2?`<em>${L(LU.check,10,3)}</em>`:live?'<em style="background:var(--city-kyoto)">ON NOW</em>':''}</div>`; }).join('')}</div></div>
  <div class="psec"><div class="psh"><h2>Rewards</h2><span>Complete collections to unlock</span></div>
    <div class="wardrobe">${OUTFITS.map(o=>{const ok=unlockedBy(o.set); return `<button class="ward ${ok?'':'lock'} ${outfit===o.id?'on':''}" data-outfit="${o.id}" ${ok?'':'aria-disabled="true"'}><span class="prev">${miniHand(o.id,84)}</span><b>${o.name}</b><small>${ok?(outfit===o.id?'Wearing':'Tap to wear'):'Complete '+SETS.find(st=>st.id===o.set).name}</small></button>`}).join('')}
      ${COVERS.map(cv2=>{const ok=unlockedBy(cv2.set); return `<button class="ward ${ok?'':'lock'} ${cover===cv2.id?'on':''}" data-cover="${cv2.id}" ${ok?'':'aria-disabled="true"'}><span class="prev"><span class="covsw ${cv2.id}"></span></span><b>${cv2.name} cover</b><small>${ok?(cover===cv2.id?'On your passport':'Tap to use'):'Complete '+SETS.find(st=>st.id===cv2.set).name}</small></button>`}).join('')}</div></div>
  ${sent.length?`<div class="psec"><div class="psh"><h2>Postcards sent</h2><span>${sent.length}</span></div><div class="shelf">${sent.map((p,i)=>{const C=CITIES[p.id],K=COUNTRIES[C.c];
      return `<button class="mini" data-pc="${i}" style="background-color:${K.color};color:${K.ink};--r:${[-3,2,-1,3][i%4]}deg"><span class="mo">${bigOutline(C.c, p.id, {dark:isDarkInk(K), pulse:false})}</span><span class="in">${lm(C.icon,'navy').replace('<svg','<svg width="26" height="26"')}</span><b>${C.name}</b><span>“${esc(p.msg)}”</span></button>`}).join('')}</div></div>`:''}
  ${accountHTML()}
  <button class="verfoot" id="verTap">POSTMARK · v0.9 beta${DEMO?' · demo mode':''}</button>
  ${DEMO?`<div class="demo" style="margin-top:8px"><small>App icon</small><div class="iconrow">${[[60,'Home screen'],[40,'Settings'],[29,'Spotlight']].map(([z,l],i)=>`<figure>${ICON(z,'d'+i)}<figcaption>${l}</figcaption></figure>`).join('')}</div><small>Demo controls</small><button id="mapBtn">Map style: ${MAPSTYLE==='real'?(REAL?'Real':'Real (loading…)')+' · tap for Hand-drawn':'Hand-drawn · tap for Real'}</button><button id="palBtn">Colours: ${document.documentElement.classList.contains('bright')?'Bright (tap for Classic)':'Classic (tap for Bright)'}</button><button id="unlockAll">Unlock all rewards</button><button id="showSplash">Show the opening screen</button><button id="resetA">Reset to the demo passport</button><button id="resetB">Start with an empty passport</button><button id="demoOff">Turn off demo mode</button></div>`:''}</div>`;
}
$('#passport').addEventListener('click', e=>{
  if(e.target.closest('#goMap')) return tab('map');
  if(e.target.closest('#addPast')) return openPastSheet();
  if(e.target.closest('#yirBtn')) return openYir();
  if(e.target.closest('#verTap')){ const now=Date.now(); verTaps=(now-verT<2500?verTaps:0)+1; verT=now;
    if(verTaps>=5){ verTaps=0; setDemo(!DEMO); } return; }
  if(e.target.closest('#demoOff')) return setDemo(false);
  if(e.target.closest('#locSw')) return setLoc(!LOC.on);
  if(e.target.closest('#syncNow')){ SYNC.dirty=true; lastStateStr=''; saveState(); pushState(); return toast('Syncing…'); }
  if(e.target.closest('#obOpen')) return openOnboard(true);
  if(e.target.closest('#resetMe')){ if(!resetArm){ resetArm=true; renderPassport(); setTimeout(()=>{ if(resetArm){ resetArm=false; if(!$('#passport').hidden) renderPassport(); } }, 4000); return; }
    resetArm=false; visited={}; unlocked={}; sent=[]; verified={}; eventStamps={}; trips=[]; activeTrip=null; inbox=[]; mailDays=[]; outfit='postie'; cover='classic'; demoAll=false; knownUnlocks=null; saveTrips(); checkUnlocks(); renderAll(); renderPassport(); renderFriends(); return toast('Passport erased. Stamp any city to start again.'); }
  const po=e.target.closest('[data-popen]'); if(po) return openCard(po.dataset.popen);
  if(e.target.closest('#editAv')){ if(stamping) return; return openAvatar(); }
  if(e.target.closest('#mapBtn')){ MAPSTYLE = MAPSTYLE==='real' ? 'drawn' : 'real'; try{ localStorage.setItem('pm-mapstyle', MAPSTYLE); }catch(err){}
    if(MAPSTYLE==='real' && !REAL){ renderPassport(); return loadReal(); } renderAll(); renderPassport(); return toast(MAPSTYLE==='real'?'Real maps on':'Hand-drawn maps on'); }
  if(e.target.closest('#palBtn')){ const b=document.documentElement.classList.toggle('bright'); try{ localStorage.setItem('pm-pal', b?'bright':'classic'); }catch(err){} renderAll(); renderPassport(); return toast(b?'Bright colours on':'Classic colours on'); }
  if(e.target.closest('#unlockAll')){ SETS.forEach(st=>st.cities.forEach(id=>{ if(!visited[id]) visited[id]=today(); })); demoAll=true; renderAll(); renderPassport(); setTimeout(checkUnlocks,300); return toast('Every collection complete. All rewards unlocked.'); }
  if(e.target.closest('#showSplash')){ showSplash(); return; }
  const ow=e.target.closest('[data-outfit]'); if(ow){ const o=OUTFITS.find(x=>x.id===ow.dataset.outfit); if(!unlockedBy(o.set)) return toast(`Complete ${SETS.find(st=>st.id===o.set).name} to unlock`); outfit=o.id; renderPassport();
    const r=toPhone(ow.querySelector('.prev')); stamping=true; return handStamp({x:r.x+r.w/2, y:r.y+r.h/2, s:.42, c:'JP', hit:()=>{}}).then(()=>{ stamping=false; }); }
  const cw=e.target.closest('[data-cover]'); if(cw){ const c2=COVERS.find(x=>x.id===cw.dataset.cover); if(!unlockedBy(c2.set)) return toast(`Complete ${SETS.find(st=>st.id===c2.set).name} to unlock`); cover=c2.id; renderPassport(); $('#pscroll').scrollTop=0; return toast(`${c2.name} cover on`); }
  if(e.target.closest('#sndBtn')){ soundOn=!soundOn; renderPassport(); if(soundOn) stampSound('JP'); return toast(soundOn?'Stamp sounds on':'Stamp sounds off'); }
  const pcb=e.target.closest('[data-pc]'); if(pcb){ const p=sent[+pcb.dataset.pc]; return openPostcard(p.id, p.msg, true); }
  const rs=e.target.closest('[data-restamp]');
  if(rs && !stamping){ stamping=true; const r=toPhone(rs.querySelector('.sq'));
    handStamp({x:r.x+r.w/2, y:r.y+r.h/2+4, s:.42, c:CITIES[rs.dataset.restamp].c, face:MOOD[rs.dataset.restamp], hit:()=>{ rs.classList.remove('again'); void rs.offsetWidth; rs.classList.add('again'); }}).then(()=>{ stamping=false; }); return; }
  if(e.target.closest('#resetA')){ visited={...START}; unlocked={...UNLOCK0}; sent=[]; verified={sydney:'gps'}; eventStamps={}; outfit='postie'; cover='classic'; demoAll=false; knownUnlocks=null; checkUnlocks(); renderAll(); renderPassport(); toast('Passport reset. Mexico is still waiting.'); }
  if(e.target.closest('#resetB')){ visited={}; unlocked={}; sent=[]; verified={}; eventStamps={}; outfit='postie'; cover='classic'; demoAll=false; knownUnlocks=null; checkUnlocks(); renderAll(); renderPassport(); toast('Empty passport. Stamp any city to start.'); }
});

let verTaps=0, verT=0;
function setDemo(on){ DEMO=on; try{ localStorage.setItem('pm-demo', on?'1':'0'); }catch(e){} renderPassport(); if(openId) refreshCard(); toast(on?'Demo mode on. Demo controls are at the bottom.':'Demo mode off'); if(on) setTimeout(()=>{ const sc=$('#pscroll'); if(sc) sc.scrollTop=sc.scrollHeight; }, 60); }

/* ---------- getting started ---------- */
const obSteps = () => [
  {k:'av', t:'Make your passport photo', d:'Pick your hair, hat and a name for your passport.', ok:!!AVA.made},
  {k:'past', t:'Add places you’ve been', d:'Past trips get a blue memory stamp.', ok:Object.keys(visited).some(isPast)},
  {k:'stamp', t:'Stamp your first city', d:'Open a city you’re in and tap “Stamp here”.', ok:Object.keys(visited).some(id=>verified[id])}];
const obSeen = () => { try{ return localStorage.getItem('pm-onb')==='1'; }catch(e){ return true; } };
function openOnboard(force){
  if(!force && (obSeen() || DEMO || Object.keys(visited).length)) return false;
  const st=obSteps(), all=st.every(x=>x.ok);
  $('#onboard').innerHTML=`<div class="ob"><div class="obh"><span class="face">${avatarSVG(AVA,60)}</span><div><h2>${all?'You’re all set':'Welcome to Postmark'}</h2></div></div>
    <p>${all?'Your passport is ready. Keep stamping.':'Your passport is empty and ready. Three quick steps to get going:'}</p>
    ${st.map((x,i)=>`<button class="step ${x.ok?'ok':''}" data-ob="${x.k}"><span class="n">${x.ok?L(LU.check,18,3):i+1}</span><span><b>${x.t}</b><span class="d">${x.d}</span></span><span class="go">${L(LU.right||LU.plane,18)}</span></button>`).join('')}
    <button class="skip" id="obSkip">${all?'Done':'I’ll explore on my own'}</button></div>`;
  $('#onboard').classList.add('on'); return true;
}
function closeOnboard(){ $('#onboard').classList.remove('on'); $('#onboard').innerHTML=''; try{ localStorage.setItem('pm-onb','1'); }catch(e){} }
$('#onboard').addEventListener('click', e=>{
  if(e.target.id==='onboard' || e.target.closest('#obSkip')) return closeOnboard();
  const b=e.target.closest('[data-ob]'); if(!b) return; closeOnboard();
  if(b.dataset.ob==='av'){ tab('passport'); return openAvatar(); }
  if(b.dataset.ob==='past'){ tab('passport'); return openPastSheet(); }
  tab('map'); toast('Pick a region, then a country, then the city you’re in');
});

/* ---------- tabs ---------- */
function tab(t){
  $('#passport').hidden = t!=='passport'; $('#trips').hidden = t!=='trips'; $('#friends').hidden = t!=='friends';
  [['tMap','map'],['tPass','passport'],['tTrips','trips'],['tFriends','friends']].forEach(([b,k])=>{ $('#'+b).classList.toggle('on', t===k); $('#'+b).toggleAttribute('aria-current', t===k); });
  if(t==='passport') renderPassport(); else if(t==='trips'){ tripView=null; renderTrips(); } else if(t==='friends'){ friendView=null; renderFriends(); loadFriends(); } else renderAll();
}
$('#tMap').onclick=()=>tab('map'); $('#tPass').onclick=()=>tab('passport'); $('#tTrips').onclick=()=>tab('trips'); $('#tFriends').onclick=()=>tab('friends');

/* ---------- fit the 390×844 canvas to the viewer ---------- */
function fit(){
  const st=$('#stage'), cs=getComputedStyle(st);
  const w=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight), h=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const roomy = w>=560 && h>=700, pad = roomy ? 20 : 4;
  const s = Math.min(1, (w-pad)/390, (h-pad)/844);
  $('#phone').style.setProperty('--s', s.toFixed(4)); $('#phone').classList.toggle('bare', !roomy);
}
addEventListener('resize', fit); fit();

try{ if(localStorage.getItem('pm-pal')!=='classic') document.documentElement.classList.add('bright'); }catch(e){ document.documentElement.classList.add('bright'); }
loadLocalState();
renderAll();
$('#art-world').classList.add('on'); $('#ui-world').classList.add('on');
checkUnlocks(); renderFriends(); showSplash(); initSync(); locRefreshState().then(st=>{ if(LOC.on && st==='granted') locTest(false); else paintLoc(); }); if(MAPSTYLE==='real') loadReal();
</script>

</body>
